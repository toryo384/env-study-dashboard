<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>環境計量士｜環濃5択ドリル142問</title><style>

button{cursor:pointer;border:1px solid #cbd6e1;border-radius:8px;background:#fff;color:#233a53;padding:9px 15px;font-size:14px;font-weight:700}button:hover{border-color:#3071bb;background:#f0f6ff}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.primary:hover{background:#174a8a}button:disabled{opacity:.45;cursor:not-allowed}
.status{margin:13px 0;display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{border:1px solid var(--border);background:white;border-radius:999px;padding:3px 11px}.progress{flex:1;min-width:160px;height:7px;background:#dce6f0;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:#2e76c4;transition:width .2s}
.question{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:clamp(18px,3.2vw,32px);box-shadow:0 3px 15px #0d254014}.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.qnumber{font-size:12px;font-weight:800;color:#2763a1;letter-spacing:.04em}.tag{font-size:12px;font-weight:700;color:#51647a;border:1px solid #e2eaf3;border-radius:99px;padding:2px 10px}
h2{font-size:clamp(18px,2.8vw,22px);line-height:1.7;margin:18px 0 20px;font-weight:750}.choices{display:grid;gap:9px}.choice{display:flex;gap:12px;align-items:flex-start;white-space:normal;text-align:left;width:100%;font:inherit;font-size:15px;font-weight:500;padding:12px 14px;min-height:52px;background:#fff;border:1px solid #cdd9e5;border-radius:9px;line-height:1.65;transition:.1s}.choice .num{font-size:13px;font-weight:800;display:grid;place-items:center;flex:0 0 24px;border:1px solid #cad7e4;border-radius:6px;line-height:22px}.choice.correct{background:#edf9f3;border:1.5px solid #4baf83}.choice.correct .num{border-color:#3da879;color:#197c56}.choice.wrong{background:#fff0f2;border:1.5px solid #d87280}.choice.wrong .num{border-color:#d26576;color:#ad3247}.choice.faded{opacity:.6}
.answer{margin-top:19px;border-top:1px solid var(--border);padding-top:18px}.answer .headline{display:flex;flex-wrap:wrap;align-items:center;gap:9px;font-size:16px;font-weight:800}.answer strong{color:var(--green)}.answer .explain{margin:11px 0 7px;padding:13px 17px;border-left:4px solid #4b85bf;background:#f1f6fc;border-radius:0 8px 8px 0;line-height:1.9}.answer .cite{font-size:12px;color:#788698;margin-top:5px}.answer .judgement{font-size:13px;color:#627387}.after{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px;justify-content:space-between}.muted{color:var(--muted);font-size:13px}.hint{margin-top:15px;border-top:1px dashed var(--border);padding-top:12px;font-size:13px;color:var(--muted)}

@media(max-width:680px){.toolbar{padding:12px}.control{min-width:calc(50% - 8px);flex:1}.qtop{align-items:flex-start}header{padding:20px 19px}.choice{font-size:14px;padding:11px}.keyboard{display:none}.question{padding:17px}}@media print{body{background:#fff}header,.toolbar,.status,.after,.hint,.footer{display:none!important}.question{box-shadow:none;border:none;padding:0}.answer{display:block!important}.choice{break-inside:avoid}main{max-width:unset}}
</style></head><body><header><div class="eyebrow">環境計量士（濃度関係） / 環濃</div><h1>本番形式 5択ドリル 142問</h1><p>教材126〜253ページ対応｜問題 → 正解 → 解説をその場で確認</p></header><main><div class="toolbar"><div class="control"><label for="cat">分野</label><select id="cat"></select></div><div class="control"><label for="mode">出題モード</label><select id="mode"><option value="all">全問・順番</option><option value="random">全問・ランダム</option><option value="mock">25問ランダム</option><option value="wrong">前回不正解だけ</option><option value="unseen">未回答だけ</option></select></div><button id="run" class="primary">この条件で出題</button><button id="reset">学習履歴を消去</button></div><div class="status"><span id="position" class="pill">1 / 142</span><div class="progress"><div id="bar"></div></div><span id="stats">学習済 0/142問</span></div><div id="out"></div><div class="footer">本教材はアップロード教材の出題範囲に基づくオリジナル5択です。公式過去問を転載したものではありません。JIS番号・規格値は資料掲載時点の内容を含みます。実務適用時は最新規格をご確認ください。オフラインで動作します。</div></main><script>
const Q=[{"topic":"計量・濃度","text":"質量分率20 mg/kgの水溶液の密度が1.25 kg/Lのとき、質量濃度として正しいものはどれか。","options":["200 mg/L","25 mg/L","16 mg/L","250 mg/L","20 mg/L"],"answer":1,"explanation":"mg/L＝mg/kg×密度(kg/L)。20×1.25＝25。質量分率と体積濃度の換算には密度が必要。","source":"教材p.126–150","origin":"前回作成5択を改訂","id":1},{"topic":"計量・濃度","text":"10.0 mg/Lの標準液から2.0 mg/Lの溶液100 mLを調製するとき、必要な標準液量はどれか。","options":["20 mL","2 mL","50 mL","80 mL","10 mL"],"answer":0,"explanation":"C₁V₁=C₂V₂より10×V₁=2×100、V₁=20 mL。","source":"教材p.126–150","origin":"前回作成5択を改訂","id":2},{"topic":"計量・濃度","text":"拡張不確かさU=8単位、包含係数k=2である。このとき標準不確かさはどれか。","options":["2","16","4","8","64"],"answer":2,"explanation":"U=kuであるためu=8/2=4。","source":"教材p.147–149","origin":"前回作成5択を改訂","id":3},{"topic":"計量・濃度","text":"全量フラスコと全量ピペットの体積校正に関する記述として正しいものはどれか。","options":["フラスコはTD、ピペットはTCである","ともに受入量（TC）である","ともに排出量（TD）である","フラスコはTC、ピペットはTDである","温度は一切影響しない"],"answer":3,"explanation":"一般に全量フラスコは受入体積（TC/In）、全量ピペットは排出体積（TD/Ex）。温度条件も重要。","source":"教材p.146–149","origin":"前回作成5択を改訂","id":4},{"topic":"排ガス","text":"NOの化学発光法の基本反応として正しいものはどれか。","options":["NOと酸素からN₂Oを生成する反応","NO₂と水の反応による沈殿","NOと水素からアンモニアを生成する反応","NOをFIDへ直接導入する反応","NOとオゾンの反応による励起NO₂の発光"],"answer":4,"explanation":"NO + O₃ → NO₂* + O₂、NO₂*が発光する。NO₂を含むNOxは変換器でNOへ変換して測定する。","source":"教材p.158–162","origin":"前回作成5択を改訂","id":5},{"topic":"排ガス","text":"ジルコニア式酸素計の測定原理として最も適切なのはどれか。","options":["酸素の紫外吸収","β線の減衰","酸素分子の電子捕獲","酸素濃淡電池の起電力","水素炎の発光"],"answer":3,"explanation":"高温の安定化ジルコニア固体電解質を介した酸素分圧差による起電力を利用する。","source":"教材p.164–167","origin":"前回作成5択を改訂","id":6},{"topic":"排ガス","text":"大気中の粒子状物質をβ線吸収方式で測るとき、適切な説明はどれか。","options":["粒子をろ紙に捕集した後のβ線減衰を利用する","ガス中のPMへβ線を照射して直接吸収を測る","粒子をイオン交換膜へ通す","粒子を高温プラズマで発光させる","粒子による熱伝導率変化を測る"],"answer":0,"explanation":"ろ紙に捕集した粒子質量とβ線減衰を関連付ける。光散乱法・圧電方式と混同しない。","source":"教材p.169–174","origin":"前回作成5択を改訂","id":7},{"topic":"排ガス","text":"排ガス中のSOxを吸収・酸化してイオンクロマトグラフ法で測定する際、最終的に主として定量する化学形はどれか。","options":["硫酸イオン","硫化物イオン","水素イオン","塩化物イオン","亜硝酸イオン"],"answer":0,"explanation":"酸化により硫酸イオンとし、ICで分離・定量する。","source":"教材p.156–158","origin":"前回作成5択を改訂","id":8},{"topic":"水質・保存","text":"シアン化物イオン測定用の試料の保存として、教材の基本的な操作はどれか。","options":["常温の開放容器にする","NaOHでpH約12にする","そのまま加熱する","硫酸でpH2にする","塩酸でpH1にする"],"answer":1,"explanation":"酸性では有害なHCNが生じ揮散するおそれがある。測定法に従いアルカリ性で保存する。","source":"教材p.189–197","origin":"前回作成5択を改訂","id":9},{"topic":"水質・保存","text":"六価クロムの試料保存に関する考え方として適切なのはどれか。","options":["価数の変化を避ける条件を選ぶ","強熱乾固後に濃度を測る","還元剤を十分添加してCr(III)へする","金属だからすべて硝酸でpH1にする","紫外線を当ててから保存する"],"answer":0,"explanation":"Cr(VI)をCr(III)へ変化させると目的成分が失われる。全金属濃度の保存操作と分けて考える。","source":"教材p.193–201","origin":"前回作成5択を改訂","id":10},{"topic":"水質・保存","text":"試料をろ過した後、ろ液を蒸発乾固して求める残留分に相当するものはどれか。","options":["BOD","懸濁物質","強熱減量そのもの","溶解性蒸発残留物","臭気強度"],"answer":3,"explanation":"ろ過前全試料の蒸発残留物と、ろ液の溶解性蒸発残留物は異なる。","source":"教材p.193–194","origin":"前回作成5択を改訂","id":11},{"topic":"水質・保存","text":"生物化学的酸素要求量（BOD）について適切な説明はどれか。","options":["過マンガン酸による酸化量のみを表す","塩素を発色させる","光散乱から濁度を求める","水中の水素イオンを測る","好気性微生物の酸素消費を利用する"],"answer":4,"explanation":"BODは好気性微生物が消費する溶存酸素量から評価する。CODとは原理が異なる。","source":"教材p.190–193","origin":"前回作成5択を改訂","id":12},{"topic":"吸光・定量","text":"入射光I₀=100、透過光I=1の吸光度Aはどれか。","options":["0.1","0.01","2","100","1"],"answer":2,"explanation":"T=I/I₀=0.01、A=−log₁₀(0.01)=2。","source":"教材p.204–208","origin":"前回作成5択を改訂","id":13},{"topic":"吸光・定量","text":"同一溶液についてランベルト・ベール則が成立し、光路長だけを2倍にしたとき吸光度はどうなるか。","options":["2倍になる","変わらない","半分になる","符号が反転する","4倍になる"],"answer":0,"explanation":"A=εlc。濃度cとε一定ならAはlに比例する。","source":"教材p.205–208","origin":"前回作成5択を改訂","id":14},{"topic":"吸光・定量","text":"標準添加法を最もよく説明するものはどれか。","options":["未知試料を標準液と混合せず直ちに測る","試料の一定量に目的成分を段階添加し、外挿を用いる","質量分析で分子イオンのみ測定","内部標準物質の信号だけを測る","試料と無関係の水に標準溶液のみ添加"],"answer":1,"explanation":"標準添加法では試料由来信号を含む直線を作り、x軸への外挿で試料中濃度を求める。","source":"教材p.205–208","origin":"前回作成5択を改訂","id":15},{"topic":"吸光・定量","text":"紫外域の短波長側の吸光度測定で一般に適するセル材質はどれか。","options":["木材","普通の着色ガラス","石英ガラス","陶磁器","鉄"],"answer":2,"explanation":"石英セルはガラスセルより短波長まで利用できる。材質ごとに透過する波長帯が異なる。","source":"教材p.204–205","origin":"前回作成5択を改訂","id":16},{"topic":"原子分析","text":"原子吸光分析とICP発光分光分析の基本的な違いとして正しいものはどれか。","options":["原子吸光では原子化しない","両者とも目的元素の蛍光X線だけを測る","どちらも必ず電子捕獲検出器を使う","ICP発光は酸素濃度の電位のみ測る","原子吸光は外部光源の吸収、ICP発光は試料からの発光を測る"],"answer":4,"explanation":"原子吸光は外部の線スペクトル光源の吸光、ICP-OESは励起原子・イオンの発光を測る。","source":"教材p.198–214","origin":"前回作成5択を改訂","id":17},{"topic":"原子分析","text":"原子吸光装置で目的元素に特有の狭い分析線を供給する典型的な光源はどれか。","options":["中空陰極ランプ","低圧水銀ランプ（装置校正用）","LEDのみ","β線源","白熱電球のみ"],"answer":0,"explanation":"中空陰極ランプは目的元素固有の輝線を放射する。水銀ランプは波長校正の設問に出る。","source":"教材p.204、209","origin":"前回作成5択を改訂","id":18},{"topic":"原子分析","text":"ミストや固体粒子による見かけの吸光度の増大を、原子吸光法で補正する方法に該当するのはどれか。","options":["スプリットレス注入","ゼーマン分裂を用いた背景補正","水質試料のpH12保存","イオンクロマトのサプレッサー","クロマトグラムの保持時間の延長"],"answer":1,"explanation":"ゼーマン補正や連続光源補正は原子吸光の背景吸収・散乱の補正。","source":"教材p.211–214","origin":"前回作成5択を改訂","id":19},{"topic":"原子分析","text":"ひ素の水素化物発生ICP発光法で検出される、ひ素を含む気体として適切なのはどれか。","options":["PH₃","NH₃","AsH₃","H₂S","CO₂"],"answer":2,"explanation":"測定条件に合わせて酸化数を調整し、アルシン（AsH₃）として気相へ移してICP発光を測る。","source":"教材p.198–203","origin":"前回作成5択を改訂","id":20},{"topic":"GC","text":"FIDとFPDに関する記述として正しいものはどれか。","options":["両者ともイオン選択電極である","FIDは電子捕獲量を測る","FIDは炎中のイオン電流、FPDは特定波長の発光を測る","両者とも放射能を用いる","FPDは熱伝導率差を測る"],"answer":2,"explanation":"同じ「炎」を使っても、FID=イオン電流、FPD=発光。","source":"教材p.215–219","origin":"前回作成5択を改訂","id":21},{"topic":"GC","text":"比較的微量の試料成分をほぼ全量カラムへ導入する方法として適切なのはどれか。","options":["連続サンプリングのみ","スプリットレス注入","スプリット注入","ダブルビーム分光","FID"],"answer":1,"explanation":"スプリットレスはほぼ全量導入、スプリットは一部をカラムへ送り残りを排出する。","source":"教材p.217–219","origin":"前回作成5択を改訂","id":22},{"topic":"GC","text":"理論段数n、カラム長L、理論段相当高さHについて正しい関係はどれか。","options":["H=n/L","n=H/L","n=L+H","n=L/H","n=L×H"],"answer":3,"explanation":"n=L/H。カラム長一定ならHが小さいほど理論段数が大きい。","source":"教材p.219–220","origin":"前回作成5択を改訂","id":23},{"topic":"GC","text":"GC測定の誘導体化の目的として不適切なのはどれか。","options":["熱安定性を改善する","選択的な検出を可能にする","必ず検出器をECDからFIDへ変更する","光学異性体を区別しやすくする","揮発性を高める"],"answer":2,"explanation":"誘導体化の目的は揮発性・安定性・選択性等の改善。検出器変更は必然ではない。","source":"教材p.216–218","origin":"前回作成5択を改訂","id":24},{"topic":"MS","text":"質量分析における電子イオン化法（EI）の一般的な条件に関する説明で正しいものはどれか。","options":["イオン選択膜で電位を測る","大気圧下で必ず水溶液を直接測る","試料気体を必ず酸で分解する","光散乱で分子量を測る","高真空下で電子を分子に衝突させてイオン化する"],"answer":4,"explanation":"EIは一般に真空中で電子衝突を起こし、フラグメントが生成しやすい。","source":"教材p.221–225","origin":"前回作成5択を改訂","id":25},{"topic":"MS","text":"ESIとAPCIに関する組合せとして正しいものはどれか。","options":["ESI＝帯電液滴、APCI＝コロナ放電による反応イオン","ESI＝水素炎、APCI＝熱伝導率","ESI＝コロナ放電、APCI＝β線捕獲","ESI＝石英セル、APCI＝ガラスセル","両者とも必ずGCの注入口で用いる"],"answer":0,"explanation":"ESIは液滴の帯電・脱溶媒、APCIは大気圧下のコロナ放電による化学イオン化が中心。","source":"教材p.221–224","origin":"前回作成5択を改訂","id":26},{"topic":"MS","text":"SIM法とSRM法の違いに関する説明で正しいものはどれか。","options":["SRMは質量分析器1台しか使用できない","両者は試料容器を指す","SIMは指定m/zを監視し、SRMは指定前駆体→生成物イオンを監視する","SIMはm/z範囲全体の取得のみを意味する","SRMは検出器が炎光光度計である"],"answer":2,"explanation":"SIMは特定イオン、SRM/MRMは前駆体から生じる特定生成物イオンを選んで検出。","source":"教材p.222–224、238–239","origin":"前回作成5択を改訂","id":27},{"topic":"MS","text":"飛行時間型質量分析計（TOF-MS）で、加速条件と電荷数が同じなら飛行時間が長いのはどちらか。","options":["同じ時間","イオンの色で決まる","重いイオン","物質の蒸気圧だけで決まる","軽いイオン"],"answer":2,"explanation":"同一加速電圧・電荷数で比較すると大きいm/zほど遅く、飛行時間が長くなる。","source":"教材p.223–224","origin":"前回作成5択を改訂","id":28},{"topic":"IC・ISE・流れ","text":"イオンクロマトグラフのサプレッサーの主な役割として正しいものはどれか。","options":["GCカラムを加熱する","試料を気化する","粒子をβ線で測る","波長を校正する","溶離液由来の背景導電率を低下させる"],"answer":4,"explanation":"溶離液の高い背景導電率を抑え、目的イオンの導電率信号を測りやすくする。","source":"教材p.191–197、234","origin":"前回作成5択を改訂","id":29},{"topic":"IC・ISE・流れ","text":"イオン選択性電極の電位と対象イオンの関係として適切なものはどれか。","options":["濃度の二乗に常に比例する","電位は赤外吸収量と等しい","活量の常用対数に応答する","対象イオンと無関係である","必ず濃度と反比例する"],"answer":2,"explanation":"ネルンスト式：電位はイオン活量の対数に依存する。温度や価数もこう配へ影響。","source":"教材p.162–163、241–243","origin":"前回作成5択を改訂","id":30},{"topic":"IC・ISE・流れ","text":"FIA（フローインジェクション分析）の説明として適切なのはどれか。","options":["一定の液流に試料を注入して反応させ、下流で検出する","分離カラムが必須でそれ以外の方式を含まない","気相反応だけを使う","試料をGCへ全量気化導入する","粒子のβ線吸収を測る"],"answer":0,"explanation":"FIAは連続する液流へ試料を導入して試薬と反応させる。CFAの分節方式と分ける。","source":"教材p.244–248","origin":"前回作成5択を改訂","id":31},{"topic":"IC・ISE・流れ","text":"連続流れ分析（CFA）とFIAの比較として正しいものはどれか。","options":["両者とも試料と試薬を接触させない","FIAは電子イオン化を意味する","CFAで液の流れを気体で分節する構成がある","CFAでは検出器が存在しない","FIAでは必ず気体分節がある"],"answer":2,"explanation":"CFAは気体分節した液流に試料・試薬を導入する構成が特徴。FIAは原則未分節の液流へ注入。","source":"教材p.244–248","origin":"前回作成5択を改訂","id":32},{"topic":"個別物質","text":"PFOS・PFOAの水質分析で出題例に合う装置・イオン化・検出の組合せはどれか。","options":["LC/MS/MS／ESI／SRM","GC-FID／EI／TCD","AAS／FID／SIM","光散乱／CI／ECD","IC／FPD／SRM"],"answer":0,"explanation":"PFOS・PFOAの規定例はLC/MS/MS、ESI、選択反応モニタリング（SRM）。EIと取り違えない。","source":"教材p.238–239","origin":"前回作成5択を改訂","id":33},{"topic":"個別物質","text":"PCBの試験法の分析手順・検出器として教材の規定例に適するものはどれか。","options":["無希釈で水素炎へ直接導入","イオン電極でpHを直接測る","水を酸分解した後GC-FIDのみ","アスコルビン酸のみで発色","ヘキサン抽出・アルカリ分解・シリカゲル精製後GC/ECDなど"],"answer":4,"explanation":"PCBは溶媒抽出・分解処理・精製の後、電子捕獲やMSで検出する方法が挙げられる。","source":"教材p.235–237","origin":"前回作成5択を改訂","id":34},{"topic":"個別物質","text":"ECD検出器を用いるヘッドスペースGC法の対象として、原理上適さない例はどれか。","options":["四塩化炭素","トリクロロエチレン","ベンゼン","クロロホルム","ジクロロメタン"],"answer":2,"explanation":"ECDは電子親和性の高い有機ハロゲン化合物等に感度が高く、ハロゲンを持たないベンゼンは適した対象ではない。","source":"教材p.237–238","origin":"前回作成5択を改訂","id":35},{"topic":"個別物質","text":"フタル酸エステルの水試料測定で誤っている操作はどれか。","options":["対象成分を有機溶媒などで抽出する","スプリットレス導入を用いる場合がある","前処理として酸による分解を必須とする","試験に使う器具由来の汚染に注意する","GC/MSで定量する"],"answer":2,"explanation":"フタル酸エステル類は抽出による前処理が基本で、酸分解を一律に行う方法ではない。","source":"教材p.240–241","origin":"前回作成5択を改訂","id":36},{"topic":"環境・校正","text":"分析計のスパンガスの役割はどれか。","options":["レンジ上限付近の感度確認","標準液の希釈用水","電極のpH調整","配管を洗浄する","測定レンジの最小値確認"],"answer":0,"explanation":"ゼロガスは低い側、スパンガスは最大目盛付近、中間点ガスは間の指示値を校正する。","source":"教材p.250–252","origin":"前回作成5択を改訂","id":37},{"topic":"環境・校正","text":"分析装置に校正用ガスを送る配管の一般的な留意点として正しいものはどれか。","options":["吸着性・反応性が大きい材料を選ぶ","成分損失を避けるため短くし、対象成分に適合する材料を用いる","曲げを多くして応答を遅くする","酸性ガスならすべて金属管でよい","できるだけ長くする"],"answer":1,"explanation":"配管は短く、不活性で透過・吸着・反応の少ない材料を選ぶ。適した材質は目的成分で変わる。","source":"教材p.250–251","origin":"前回作成5択を改訂","id":38},{"topic":"環境・校正","text":"教材に掲載された「人の健康の保護に関する水質環境基準」の組合せとして正しいものはどれか（教材当時の数値）。","options":["六価クロム 0.5 mg/L","Cd 0.03 mg/L","ひ素 0.01 mg/L","総水銀 0.01 mg/L","セレン 0.1 mg/L"],"answer":2,"explanation":"教材の表ではCd 0.003、As 0.01、Cr(VI) 0.05、総水銀0.0005、Se 0.01 mg/L。現行の公表基準は別途確認。","source":"教材p.248–250","origin":"前回作成5択を改訂","id":39},{"topic":"環境・校正","text":"次の採取器と主な採取対象の組合せとして正しいものはどれか。","options":["キャニスター―水底の泥","エクマンバージ採泥器―大気中の粉じん","ハイボリウムエアサンプラ―地下水","ハイロート採水器―所定深さの水","サーバーネット―燃焼排ガス中のNO"],"answer":3,"explanation":"ハイロートは水域採水。エクマンバージは底質、キャニスターは気体、ハイボリウムは粒子、サーバーネットは水中生物等。","source":"教材p.249–250","origin":"前回作成5択を改訂","id":40},{"topic":"選択法・妨害","text":"ICP発光分析で高濃度共存元素の発光線が目的元素の波長近傍に重なる場合、これは何と呼ばれるか。","options":["理論段数","磁気力干渉","サプレッサー","分光干渉","質量電荷比"],"answer":3,"explanation":"スペクトル線や分子バンドが重なるのは分光干渉。イオン化干渉・物理干渉とは区別。","source":"教材p.226–228","origin":"前回作成5択を改訂","id":41},{"topic":"選択法・妨害","text":"ICP-MSのコリジョン・リアクションセルの主目的として最も適切なのはどれか。","options":["イオンを液体に戻す","測定元素以外に由来するスペクトル干渉を低減する","濃度をpHから決める","質量分析部の後段でしか使えない","全溶質を熱分解する"],"answer":1,"explanation":"気体分子との衝突や反応性の差で多原子イオン等のスペクトル干渉を低減する。通常は質量分離部の前に位置する。","source":"教材p.228–229","origin":"前回作成5択を改訂","id":42},{"topic":"選択法・妨害","text":"イオンクロマトグラフ法で陰イオンをUV検出するときの説明で正しいものはどれか。","options":["UVがあれば分離カラムは不要","塩化物イオンは必ず紫外吸収検出器で測る","紫外吸収を示す硝酸・亜硝酸などはUV検出できる場合がある","共存イオンによる妨害は必ず消える","UVは溶離液の全導電率のみを測る"],"answer":2,"explanation":"硝酸・亜硝酸等のUV吸収を用いた検出が可能。塩化物イオンの測定を必ずUVで行うとはいえない。","source":"教材p.191–197","origin":"前回作成5択を改訂","id":43},{"topic":"選択法・妨害","text":"全りんのモリブデン青吸光光度法に関して正しいものはどれか。","options":["モリブデン青は反応しない","結合残留塩素に変えて定量する","有機態を酸化分解せず直接FIDで測る","検出波長は193.696nmのみ","酸化分解してりん酸イオンにした後、モリブデン青を発色させる"],"answer":4,"explanation":"ペルオキソ二硫酸カリウム等で各態のPをりん酸へ酸化し、モリブデン青の吸光度を測る。880nm近傍の出題例。","source":"教材p.202–203","origin":"前回作成5択を改訂","id":44},{"topic":"計量・濃度","text":"0.100 mol/LのNaOH水溶液200 mLに含まれるNaOHの質量はどれか。ただし式量40.0とする。","options":["0.080 g","8.00 g","2.00 g","0.800 g","0.400 g"],"answer":3,"explanation":"物質量0.100×0.200=0.0200 mol、質量0.0200×40.0=0.800 g。mLをLへ直して計算する。","source":"教材p.126–145","origin":"写真の出題パターンを踏まえた新規5択","id":45},{"topic":"計量・濃度","text":"体積分率が1.5 %の気体をppmで表した値はどれか。","options":["150,000 ppm","15,000 ppm","15 ppm","150 ppm","1,500 ppm"],"answer":1,"explanation":"1 %=10,000 ppm。1.5×10,000=15,000 ppm。%→ppmは10⁴倍する。","source":"教材p.126–145","origin":"写真の出題パターンを踏まえた新規5択","id":46},{"topic":"計量・濃度","text":"質量濃度5.0 mg/Lの溶液を4倍に希釈した場合の濃度はどれか。","options":["20 mg/L","5.0 mg/L","0.80 mg/L","1.25 mg/L","2.0 mg/L"],"answer":3,"explanation":"希釈後濃度=5.0/4=1.25 mg/L。「4倍に希釈」は最終体積を4倍にすること。","source":"教材p.126–145","origin":"写真の出題パターンを踏まえた新規5択","id":47},{"topic":"計量・濃度","text":"質量分率と質量濃度を比較した説明として正しいものはどれか。","options":["温度を変えても体積基準の濃度は必ず一定","mg/kgとmg/Lはすべての水溶液で同じ値","mg/kgは質量濃度、mg/Lは質量分率","密度が1.20 kg/Lの場合mg/Lはmg/kgの1.20分の1になる","質量分率を質量濃度へ換算するには通常、溶液の密度が必要"],"answer":4,"explanation":"mg/L=mg/kg×密度(kg/L)。質量基準と体積基準は別物で、密度と体積の温度変化が重要。","source":"教材p.126–145","origin":"写真の出題パターンを踏まえた新規5択","id":48},{"topic":"計量・濃度","text":"2つの独立した標準不確かさ3と4を二乗和平方根で合成したときの合成標準不確かさはどれか。","options":["3.5","7","5","1","12"],"answer":2,"explanation":"uc=√(3²+4²)=5。独立成分を単純加算するのではない。","source":"教材p.145–150","origin":"写真の出題パターンを踏まえた新規5択","id":49},{"topic":"計量・濃度","text":"全量フラスコと全量ピペットに関する次の記述のうち誤っているものはどれか。","options":["全量フラスコは一般にTC/Inで校正される","全量ピペットは一般にTD/Exで校正される","体積は校正温度の影響を受ける","全量ピペットは一般に内容液をすべて吹き出して使用する","標線合わせではメニスカスを適切に読む"],"answer":3,"explanation":"全量ピペットでは通常、自然流下後に所定の待ち時間を置き、先端の残液を無理に吹き出さない（吹出し式を除く）。フラスコTC、ピペットTDも対比。","source":"教材p.146–150","origin":"写真の出題パターンを踏まえた新規5択","id":50},{"topic":"計量・濃度","text":"指示値30 mg/Lに対する標準不確かさ1.5 mg/Lの相対標準不確かさはどれか。","options":["2.0 %","5.0 %","15 %","0.5 %","20 %"],"answer":1,"explanation":"1.5/30×100=5.0 %。相対不確かさは絶対値を測定値で割る。","source":"教材p.145–150","origin":"写真の出題パターンを踏まえた新規5択","id":51},{"topic":"計量・濃度","text":"検量線法で測定結果が直線範囲を超えた場合、まず行う操作として適切なものはどれか。","options":["最小濃度の標準液だけを使う","測定値を検量線の最大値として報告する","指示値を100で割って報告する","試料を適切に希釈して検量線範囲内で再測定する","検量線を原点固定に変更する"],"answer":3,"explanation":"検量線の定量範囲外への外挿は避ける。希釈倍数も反映する。","source":"教材p.126–150","origin":"写真の出題パターンを踏まえた新規5択","id":52},{"topic":"排ガス","text":"赤外線吸収を利用する連続測定器の代表的な対象として適切なものはどれか。","options":["二酸化炭素","水のpH","粒子状物質（重量法）","酸素（常磁性）","シアン化物イオン"],"answer":0,"explanation":"CO₂など赤外活性分子は非分散形赤外分析計で測定される。O₂は常磁性式など、粒子は別の原理。","source":"教材p.151–185","origin":"写真の出題パターンを踏まえた新規5択","id":53},{"topic":"排ガス","text":"排ガスのNOx測定で化学発光方式を用いるとき、NO₂を含めたNOxの測定に必要な操作はどれか。","options":["NO₂をNOへ変換する","NOを硫酸イオンにする","水素炎中でイオン化する","NO₂を揮発させないよう凍結する","窒素を完全除去する"],"answer":0,"explanation":"化学発光は主にNOとオゾンの反応による発光を検出する。NO₂をNOへ変換してNOxを評価する。","source":"教材p.158–163","origin":"写真の出題パターンを踏まえた新規5択","id":54},{"topic":"排ガス","text":"ジルコニア式酸素分析計について正しいものはどれか。","options":["酸素分圧差に対応する電池起電力を測る","NOの化学発光を測る","金属イオンの沈殿量を測る","酸素のFID応答を利用する","常温の色変化を測る"],"answer":0,"explanation":"安定化ジルコニアを高温の酸素イオン伝導体として使い、酸素濃淡電池の起電力を測定。","source":"教材p.164–168","origin":"写真の出題パターンを踏まえた新規5択","id":55},{"topic":"排ガス","text":"光散乱式粒子状物質測定とβ線吸収式測定の組合せとして正しいものはどれか。","options":["両者とも質量電荷比","光散乱＝粒子による散乱光、β線＝捕集粒子によるβ線減衰","光散乱＝磁化率、β線＝電極電位","両者ともGC保持時間","光散乱＝ろ紙の質量、β線＝炎の発光"],"answer":1,"explanation":"光散乱は散乱光強度、β線吸収はろ紙等の捕集粒子による透過β線の減衰を利用する。","source":"教材p.169–174","origin":"写真の出題パターンを踏まえた新規5択","id":56},{"topic":"排ガス","text":"気体流量を標準状態の体積流量へ換算するとき、正しい考え方はどれか。","options":["ppmへ換算すれば自動的に標準状態になる","絶対温度ではなく摂氏温度の比を用いる","湿りガスと乾きガスの違いは無視する","実測圧力・温度は不要","理想気体の状態方程式に従い圧力と絶対温度を補正する"],"answer":4,"explanation":"理想気体近似ではP×V/Tが一定。乾きガスか湿りガスかも採用する条件による。","source":"教材p.126–160","origin":"写真の出題パターンを踏まえた新規5択","id":57},{"topic":"排ガス","text":"排ガスの採取位置として最も適切なのはどれか。","options":["凝縮水が流入しやすい位置","常にダクト屈曲部の直後","流速変動が極端に大きい位置","採取管が最長になる位置","流れの偏りが少なく代表性を確保できる位置"],"answer":4,"explanation":"試料の代表性を確保するため、流速や濃度の偏りが小さく測定に適した場所を選ぶ。","source":"教材p.151–160","origin":"写真の出題パターンを踏まえた新規5択","id":58},{"topic":"排ガス","text":"GCで測定する排ガス中の一酸化二窒素（N₂O）について、教科書に記載された典型的な検出器はどれか。","options":["FPD","UV-Vis","TCD","FID","ECD"],"answer":4,"explanation":"JIS K 0110に関する掲載問題ではN₂Oに電子捕獲検出器（ECD）が挙げられる。FPDは硫黄・リン、FIDは有機物。","source":"教材p.186","origin":"写真の出題パターンを踏まえた新規5択","id":59},{"topic":"排ガス","text":"排ガス中の二硫化炭素・メルカプタンのGC分析に用いる検出器として典型的なのはどれか。","options":["FPD","UV-Vis","電気伝導率検出器","FIDのみ","ECD"],"answer":0,"explanation":"硫黄を含む化合物は炎光光度検出器（FPD）で選択的に検出できる。","source":"教材p.186","origin":"写真の出題パターンを踏まえた新規5択","id":60},{"topic":"排ガス","text":"排ガス中のフェノール類・ピリジンのGC分析で教材に示された検出器はどれか。","options":["TCD","PID","ECD","FID","FPD"],"answer":3,"explanation":"JIS K 0086（フェノール類）・K 0087（ピリジン）の掲載設問ではFIDを用いる。","source":"教材p.186","origin":"写真の出題パターンを踏まえた新規5択","id":61},{"topic":"排ガス","text":"悪臭の臭気指数に関する説明として適切なのはどれか。","options":["アンモニア濃度だけで決まる","pHから計算する","水素炎イオン化検出器で直接測る","官能試験に基づく臭気濃度から算出する","溶存酸素量と一致する"],"answer":3,"explanation":"臭気濃度は官能試験（嗅覚測定）によって求め、臭気指数は一般に10log₁₀(臭気濃度)で定義される。","source":"教材p.190–191","origin":"写真の出題パターンを踏まえた新規5択","id":62},{"topic":"水質・保存","text":"アンモニウムイオン用水試料を採取後直ちに測定できない場合、教材に示された保存条件として適切なのはどれか。","options":["過塩素酸で加熱する","NaOHでpH12にする","強熱乾固する","無処理で開放放置する","塩酸等でpH2～3とし冷暗所保存"],"answer":4,"explanation":"アンモニウムイオンは酸を加えpH約2～3とし0～10℃の暗所保存という設問。シアンとは保存pHが逆。","source":"教材p.189–197","origin":"写真の出題パターンを踏まえた新規5択","id":63},{"topic":"水質・保存","text":"シアン化合物測定用の試料に強酸を加えて保存することが不適切な主な理由はどれか。","options":["溶存酸素が増加する","硫酸イオンが必ず消える","揮発性のシアン化水素が生成・散逸するおそれ","pHが常に中性になる","全シアンが重金属に変わる"],"answer":2,"explanation":"シアン化物は酸性化するとHCNを生じ揮散する危険。アルカリ側で保つ。","source":"教材p.189–197","origin":"写真の出題パターンを踏まえた新規5択","id":64},{"topic":"水質・保存","text":"六価クロム測定用の水試料を酸性にしない理由として適切なものはどれか。","options":["Cr(VI)の質量が変化するから","Cr(VI)のCr(III)への還元を避けたいから","すべてのCrが沈殿するから","H₂が必ず発生するから","Cr(VI)が昇華するから"],"answer":1,"explanation":"Cr(VI)は酸性で還元されやすい条件があり、価数保存が重要。全金属の酸性保存条件をそのまま当てはめない。","source":"教材p.193–197","origin":"写真の出題パターンを踏まえた新規5択","id":65},{"topic":"水質・保存","text":"溶存態金属と全金属の定量方法の違いとして正しいものはどれか。","options":["溶存態は適切にろ過し、全金属は必要に応じて固形分も分解して測定","ろ過操作は化学形に影響しないことが保証される","溶存態はすべての懸濁物を含む","両者とも採取水を無条件にそのまま測定","全金属はろ液のみを測る"],"answer":0,"explanation":"溶存態と全量は分画の定義が異なる。適切なろ過や酸分解の要否を区別する。","source":"教材p.189–201","origin":"写真の出題パターンを踏まえた新規5択","id":66},{"topic":"水質・保存","text":"強熱減量の意味として正しいものはどれか。","options":["一定温度で強熱する前後の残留物質量の減少","試料中の溶存酸素消費量","ろ過直後のろ紙質量","試料のCODと常に一致","GCのピーク面積"],"answer":0,"explanation":"強熱前の残留物と強熱後残留物の差を強熱減量という。蒸発残留物や懸濁物質と区別。","source":"教材p.193–194","origin":"写真の出題パターンを踏まえた新規5択","id":67},{"topic":"水質・保存","text":"ろ過によって求める懸濁物質（SS）の定義に最も近いものはどれか。","options":["所定のろ過材上に捕集され乾燥後残る物質","水の全溶存塩類だけ","気化した有機物の量","BOD値と同じ","ろ液を蒸発乾固した残り"],"answer":0,"explanation":"SSはろ過材上の捕集物質を測定する。ろ液から得る溶解性蒸発残留物と逆。","source":"教材p.193–194","origin":"写真の出題パターンを踏まえた新規5択","id":68},{"topic":"水質・保存","text":"TON（臭気強度）に関する教材の記載と整合するものはどれか。","options":["溶存酸素量を差し引く","ICP発光強度を測る","GC/MSによる質量電荷比で定める","電気伝導率を1,000倍する","無臭水による希釈と官能判定を用いる"],"answer":4,"explanation":"臭気強度（TON）は官能試験を用いる。化学分析装置で直接定義する値ではない。","source":"教材p.190–191","origin":"写真の出題パターンを踏まえた新規5択","id":69},{"topic":"水質・保存","text":"水の電気伝導率に関して正しいものはどれか。","options":["イオンを含んでも必ずゼロ","比抵抗の逆数に相当する","試料中の気泡の数を測る","単位は必ずmol/Lである","濁度と同じ量である"],"answer":1,"explanation":"電気伝導率κは比抵抗ρの逆数κ=1/ρ。単位はS/m等。","source":"教材p.190–191","origin":"写真の出題パターンを踏まえた新規5択","id":70},{"topic":"水質・保存","text":"水中のBODとCODの違いとして正しいものはどれか。","options":["どちらも微生物の酸素消費だけを測る","BODは光散乱で決まる","BODは生物による酸素消費、CODは酸化剤による酸化に対応","CODは窒素の質量だけ","両者は同じ試料で常に同数値"],"answer":2,"explanation":"BODは好気性微生物の酸素消費量、CODは規定酸化剤での酸素相当消費量。反応原理が違う。","source":"教材p.190–193","origin":"写真の出題パターンを踏まえた新規5択","id":71},{"topic":"滴定・化学分析","text":"よう素滴定による溶存酸素測定（ウィンクラー法）の考え方として正しいものはどれか。","options":["pHのみから濃度を換算","溶存酸素を使って二価Mnを酸化し、酸性化後に発生するよう素を滴定","滴定量は光路長で決まる","酸素をFIDで燃焼させる","溶存酸素がNaClと直接反応して沈殿"],"answer":1,"explanation":"アルカリ性で生じたMn(OH)₂が酸素で酸化され、酸性でI⁻からI₂を遊離させチオ硫酸で滴定する。","source":"教材p.199–200","origin":"写真の出題パターンを踏まえた新規5択","id":72},{"topic":"滴定・化学分析","text":"全りんのモリブデン青法で、りん酸イオンを最終的に何として測定するか。","options":["蛍光X線","モリブデン青の吸光度","水素炎イオン電流","pH電極電位","電子捕獲電流"],"answer":1,"explanation":"りん酸塩がモリブデン酸と反応して生じるヘテロポリ化合物を還元し、青色の吸光度で定量する。","source":"教材p.202–203","origin":"写真の出題パターンを踏まえた新規5択","id":73},{"topic":"滴定・化学分析","text":"全りん試料の過硫酸カリウム分解の目的として正しいものはどれか。","options":["各形態のりんをりん酸イオンとして測れる形にする","クロラミンを生成する","試料を中性塩へ完全変換する","りんを全量揮発させる","りんを質量分析計で直接量る"],"answer":0,"explanation":"全りんでは有機態や縮合態などを分解し、定量しやすいりん酸イオンへ変換する。","source":"教材p.202–203","origin":"写真の出題パターンを踏まえた新規5択","id":74},{"topic":"滴定・化学分析","text":"キレート樹脂分離濃縮法について正しいものはどれか。","options":["CaやMgの硬度だけに適用される","吸光度を用いず必ず磁場だけで測定","KやNaなどが最優先の適用対象","目的金属イオンを樹脂へ捕集し、酸などで溶出する","固定相がないので濃縮できない"],"answer":3,"explanation":"キレート樹脂の金属配位を使って捕集・濃縮し、酸で溶出する。Na/Kなどアルカリ金属には一般に適さない。","source":"教材p.198–201","origin":"写真の出題パターンを踏まえた新規5択","id":75},{"topic":"滴定・化学分析","text":"全残留塩素の内訳として正しいものはどれか。","options":["二酸化塩素と溶存酸素","CODとBOD","亜硝酸イオンと硝酸イオン","遊離残留塩素と結合残留塩素","塩化物イオンと硫酸イオン"],"answer":3,"explanation":"残留塩素は遊離残留塩素（HClO/ClO⁻）と結合残留塩素（クロラミン等）の和。","source":"教材p.191–192","origin":"写真の出題パターンを踏まえた新規5択","id":76},{"topic":"滴定・化学分析","text":"ひ素を水素化物発生法で分析するときに発生させる気体はどれか。","options":["H₂S","NH₃","CO₂","SO₂","AsH₃"],"answer":4,"explanation":"ひ素ではアルシン（AsH₃）を発生させて気相へ分離・導入する。","source":"教材p.198–203","origin":"写真の出題パターンを踏まえた新規5択","id":77},{"topic":"滴定・化学分析","text":"亜ひ酸・ひ酸の酸化数と前処理の組合せとして適切なのはどれか。","options":["溶存酸素を定量して全ひ素とする","As(III)とAs(V)を必要な価数へ調整し水素化物発生","ひ素だけを電気伝導率で特異検出","As(V)をNH₄⁺へ還元","すべてのひ素を金属Asへ沈殿"],"answer":1,"explanation":"水素化物発生では反応性に合わせ酸化数を前処理で調整する。ひ素の化学形と気相分離を結びつける。","source":"教材p.198–203","origin":"写真の出題パターンを踏まえた新規5択","id":78},{"topic":"吸光・定量","text":"透過率Tが0.1の試料の吸光度Aはどれか。","options":["0.01","2.00","1.00","0.10","10.0"],"answer":2,"explanation":"A=−log₁₀T=−log₁₀0.1=1.00。透過率と吸光度は線形比例しない。","source":"教材p.204–208","origin":"写真の出題パターンを踏まえた新規5択","id":79},{"topic":"吸光・定量","text":"透過率が10 %から1 %になったとき、吸光度はどう変化するか。","options":["2から1になる","半分になる","変わらない","1から2になる","10倍になり10になる"],"answer":3,"explanation":"10%=0.10→A=1、1%=0.01→A=2。透過率の10倍差で吸光度は1変化。","source":"教材p.204–208","origin":"写真の出題パターンを踏まえた新規5択","id":80},{"topic":"吸光・定量","text":"同じ試料で吸光度を2倍にしたいとき、ランベルト・ベール則が成立する範囲でできる操作はどれか。","options":["光路長を2倍にする","透過率を2倍にする","入射光強度だけを2倍にする","モル吸光係数を半分にする","濃度を半分にする"],"answer":0,"explanation":"A=εlc。ε・c一定なら光路長lを2倍にするとAも2倍。","source":"教材p.205–207","origin":"写真の出題パターンを踏まえた新規5択","id":81},{"topic":"吸光・定量","text":"石英セルと通常のガラスセルの使い分けとして正しいものはどれか。","options":["両者とも使える波長が完全一致","ガラスは短波長ほど必ず透過率が高い","石英セルは紫外域の測定に適する","石英セルは赤外測定専用","ガラスは紫外域の短波長まで石英以上に透過"],"answer":2,"explanation":"石英は短波長の紫外域に対応。通常のガラスセルは短波長紫外で吸収が大きくなる。","source":"教材p.204–205","origin":"写真の出題パターンを踏まえた新規5択","id":82},{"topic":"吸光・定量","text":"吸光光度計の波長正確さを確認する手段として適切なのはどれか。","options":["GC保持時間の標準偏差を測定","酸素ボンベの圧力を測定","試料セルを強熱","pH4標準液だけを測定","水銀ランプの輝線波長を利用"],"answer":4,"explanation":"低圧水銀ランプ等の既知の輝線を用いて、測定ピークの波長位置を点検する。","source":"教材p.204–208","origin":"写真の出題パターンを踏まえた新規5択","id":83},{"topic":"吸光・定量","text":"検量線が曲線になった場合の判断として適切なものはどれか。","options":["直線近似の外挿値は常に正しい","標準添加法なら必ず使える","濃度と吸光度が必ず比例する","検量線法でも標準添加法でも、モデルと適用範囲の妥当性を確認する","横軸と縦軸の単位を交換すれば解決"],"answer":3,"explanation":"吸光度の非線形は濃度範囲・化学平衡・迷光等でも生じる。直線モデルの妥当性を検証する。","source":"教材p.205–208","origin":"写真の出題パターンを踏まえた新規5択","id":84},{"topic":"吸光・定量","text":"標準添加法の測定結果を横軸が添加標準濃度、縦軸が信号の直線に表したとき、試料中濃度は何から求めるか。","options":["縦軸の最大値","横軸上の負の切片の絶対値（体積補正等を考慮）","最小信号の半分","保持時間だけ","ゼロ添加時の標準物質濃度"],"answer":1,"explanation":"標準添加量を変えた直線を負の横軸側へ外挿し、ゼロ信号となる濃度を求める。必要な希釈・体積補正を忘れない。","source":"教材p.205–208","origin":"写真の出題パターンを踏まえた新規5択","id":85},{"topic":"吸光・定量","text":"標準添加法と内標準法の説明として正しいものはどれか。","options":["標準添加法＝測定試料に目的物質を段階添加、内標準法＝一定量の基準物質を加えて信号比をとる","標準添加法＝内部基準物質の信号比、内標準法＝pHを固定","内標準法は必ず異なる試料を無限に用意する","両者とも物質の追加が一切不要","標準添加法は感度がゼロでも成立"],"answer":0,"explanation":"標準添加法はマトリックスを揃えて目的物質を添加、内標準法は目的物質と性質の近い別物質の信号比。","source":"教材p.188、205–208、226–227","origin":"写真の出題パターンを踏まえた新規5択","id":86},{"topic":"原子分析","text":"原子吸光とICP発光の信号の違いとして正しいものはどれか。","options":["ICP発光はβ線透過率のみ","両方とも必ず吸光度の測定","原子吸光は質量電荷比のみ","原子吸光は外部光の吸収、ICP発光は励起した粒子の発光","両方とも水素炎のイオン電流"],"answer":3,"explanation":"原子吸光（AAS）は目的元素による光の吸収。ICP-OESはプラズマで励起された原子・イオンの発光強度。","source":"教材p.198–214","origin":"写真の出題パターンを踏まえた新規5択","id":87},{"topic":"原子分析","text":"原子吸光法で用いる中空陰極ランプについて正しいものはどれか。","options":["元素固有の輝線を与える","広い連続光だけを放射する","発光測定のためのICPトーチ","イオン交換樹脂の再生器","標準溶液を噴霧する"],"answer":0,"explanation":"中空陰極ランプは目的元素の狭い原子線を供給するための光源。","source":"教材p.209–214","origin":"写真の出題パターンを踏まえた新規5択","id":88},{"topic":"原子分析","text":"フレーム原子吸光の予混合バーナーについて正しいものはどれか。","options":["噴霧された試料液が100 %炎へ導入される","炎の色だけで元素同定が完結","原子は真空中にのみ存在","検出器には必ずECDを用いる","大きな液滴は除去され、細かい霧が燃焼部に導入される"],"answer":4,"explanation":"予混合式では霧化室で大きな液滴がドレインへ排出され、細かい霧を炎へ送る。全噴霧液が到達するわけではない。","source":"教材p.209–210","origin":"写真の出題パターンを踏まえた新規5択","id":89},{"topic":"原子分析","text":"原子吸光法で試料のミストや微粒子による光散乱が問題となった場合の補正として適切なのはどれか。","options":["イオン交換膜の交換のみ","FIDのキャリヤーガス変更","サプレッサーの電気伝導率抑制","GCカラムの理論段数増大","ゼーマン分裂を用いた背景補正"],"answer":4,"explanation":"AASではゼーマン補正や連続光源補正などで非特異的背景吸収・散乱の影響を補正する。","source":"教材p.211–214","origin":"写真の出題パターンを踏まえた新規5択","id":90},{"topic":"原子分析","text":"ICP発光分析で高濃度共存元素の発光が目的分析線に重なる場合に分類される干渉はどれか。","options":["流速干渉のみ","磁気浮上干渉","熱伝導率干渉","クロマトグラフ保持時間干渉","分光干渉"],"answer":4,"explanation":"発光線が重なるのは分光干渉。粘度・噴霧効率の違いなどは物理干渉。","source":"教材p.226–228","origin":"写真の出題パターンを踏まえた新規5択","id":91},{"topic":"原子分析","text":"ICP発光分光法で高濃度の容易にイオン化される共存元素が存在する影響はどれか。","options":["イオン化干渉","試料の全元素が必ず消失","GCの分離度だけが増す","吸光度が常にゼロ","電子捕獲電流が減るだけ"],"answer":0,"explanation":"共存するNa/Kなどがプラズマの電子密度・イオン化平衡を変えるイオン化干渉。","source":"教材p.228","origin":"写真の出題パターンを踏まえた新規5択","id":92},{"topic":"原子分析","text":"ICP発光の分光干渉低減に直接つながる操作として正しいものはどれか。","options":["キャリヤーガスを水に置き換える","有効桁数を1桁に変更","標準添加法なら発光線重複は必ず完全に消える","干渉の少ない別波長の分析線を選択","試料瓶を変えるだけ"],"answer":3,"explanation":"共存元素の発光線と重ならない分析波長を選択するのが直接的な対策。バックグラウンドや元素間干渉補正も用いる。","source":"教材p.226–228","origin":"写真の出題パターンを踏まえた新規5択","id":93},{"topic":"原子分析","text":"ICP-MSのコリジョン・リアクションセルについて適切な説明はどれか。","options":["検出器内で吸光度をゼロにする","共存物由来の質量スペクトル干渉イオンを減らすため気体との衝突・反応を利用する","光路長を固定する","GCの誘導体化を行う","ろ過材の細孔径を変える"],"answer":1,"explanation":"セル内でHe等との衝突や反応を使い、多原子イオン等のスペクトル干渉を低減する。","source":"教材p.228–229","origin":"写真の出題パターンを踏まえた新規5択","id":94},{"topic":"原子分析","text":"ICP-MSのネブライザーとスプレーチャンバーの関係として正しいものはどれか。","options":["チャンバーでは大きな液滴のみプラズマへ送る","ネブライザーで霧化し、チャンバーで主に微細液滴を選別","チャンバーは試料の質量電荷比を選別","ネブライザーでイオン検出、チャンバーで保持時間測定","双方とも原子吸光専用光源"],"answer":1,"explanation":"ネブライザーは液体を霧化、スプレーチャンバーは大液滴を除き細かな液滴を選んでプラズマへ送る。","source":"教材p.229–230","origin":"写真の出題パターンを踏まえた新規5択","id":95},{"topic":"原子分析","text":"四重極質量分析計の分離原理として適切なものはどれか。","options":["固定磁場だけで必ず質量を分離","ろ紙の捕集量で分離","液相での沸点差だけで分離","元素の炎色だけで分離","直流・高周波電場で特定m/zの軌道を安定化して通過させる"],"answer":4,"explanation":"四重極は高周波RFと直流DCの電場条件で安定軌道をもつm/zイオンを選択的に通す。","source":"教材p.229–230","origin":"写真の出題パターンを踏まえた新規5択","id":96},{"topic":"GC","text":"TCD（熱伝導度検出器）の感度に関する記述として正しいものはどれか。","options":["キャリヤーの熱伝導率と同じ試料ほど高感度","硫黄のみを選択的に検出","電子捕獲反応だけを利用","試料とキャリヤーの熱伝導率差が重要","紫外線照射によるイオン化"],"answer":3,"explanation":"TCDは試料ガスとキャリヤーの熱伝導率差を検出する。差が小さいと信号も小さくなりやすい。","source":"教材p.215–219","origin":"写真の出題パターンを踏まえた新規5択","id":97},{"topic":"GC","text":"FIDとFPDの正しい対応はどれか。","options":["両者とも電極pHのみ","両者ともUV吸収だけ","FID＝水素炎中のイオン電流、FPD＝燃焼による特定波長の発光","FID＝電子捕獲、FPD＝熱伝導","FID＝GCの質量分離、FPD＝イオン伝導"],"answer":2,"explanation":"水素炎を使っても測る物理量が違う。FIDはイオン電流、FPDは発光（S・P等）。","source":"教材p.215–219","origin":"写真の出題パターンを踏まえた新規5択","id":98},{"topic":"GC","text":"窒素・りん化合物に選択性を示すことが多いGC検出器はどれか。","options":["TCD","ECD","FPDのみ","示差屈折率検出器","FTD（熱イオン化検出器）"],"answer":4,"explanation":"FTD/TIDはアルカリ塩を使う熱イオン化検出で窒素・りん化合物に応答する。FPDはS・Pなど。","source":"教材p.215–221","origin":"写真の出題パターンを踏まえた新規5択","id":99},{"topic":"GC","text":"ハロゲン化有機物に対し高感度であることが多いGC検出器はどれか。","options":["FPD","FID","TCD","UVセル","ECD"],"answer":4,"explanation":"ECDは電子親和性の高いハロゲン含有化合物・ニトロ化合物などで高感度。","source":"教材p.216–219","origin":"写真の出題パターンを踏まえた新規5択","id":100},{"topic":"GC","text":"一般にGCの理論段数nが大きくなる方向はどれか。","options":["同じカラム長でHを小さくする","ピークを広げる","保持時間をすべてゼロにする","固定相を取り除く","同じカラム長でHを大きくする"],"answer":0,"explanation":"n=L/H。理論段相当高さHが小さいほどカラム効率が高い。","source":"教材p.219–220","origin":"写真の出題パターンを踏まえた新規5択","id":101},{"topic":"GC","text":"van Deemterプロットの縦軸と横軸の組合せはどれか。","options":["理論段相当高さH・移動相平均線速度u","BOD・COD","吸光度・濃度","m/z・イオン強度","電極電位・pH"],"answer":0,"explanation":"H=A+B/u+Cu の関係を示す。最小Hを与える適切な流速を考える。","source":"教材p.219–220","origin":"写真の出題パターンを踏まえた新規5択","id":102},{"topic":"GC","text":"キャピラリーGCの固定相膜厚を薄くしたとき、理論段相当高さが小さくなる主要な理由はどれか。","options":["キャリヤー流速を必ずゼロにする","電子捕獲確率を上げる","気化室の質量をゼロにする","固定相内の物質移動に要する時間を減らす","試料中の水を完全に除く"],"answer":3,"explanation":"固定相膜厚の低減は固定相内での拡散距離を短くし、物質移動抵抗を下げる方向に働く。","source":"教材p.219–220","origin":"写真の出題パターンを踏まえた新規5択","id":103},{"topic":"GC","text":"スプリット注入とスプリットレス注入の使い分けで正しいものはどれか。","options":["スプリットレスは検出器を取り外す操作","微量分析ではスプリットレスが適する場合が多い","スプリットは全量カラムへ送る","両者はまったく同じ","高濃度なら必ずスプリットレス"],"answer":1,"explanation":"スプリットは一部だけカラムへ導入、スプリットレスはほぼ全量を導入し微量測定に使う。","source":"教材p.217–219","origin":"写真の出題パターンを踏まえた新規5択","id":104},{"topic":"GC","text":"クロマトグラフィーの分離度Rが大きいことの意味として正しいものはどれか。","options":["保持時間がゼロになる","隣接ピークがより良好に分離","ピーク面積が必ず等しい","ピークが完全に重なっている","装置の消費電力が大きい"],"answer":1,"explanation":"分離度はピーク間隔とピーク幅の比であり、Rが大きいほど通常よく分離している。","source":"教材p.219、235","origin":"写真の出題パターンを踏まえた新規5択","id":105},{"topic":"GC","text":"保持時間150 sと120 s、各ピーク幅が18 sと12 sのとき、分離度R=2(tR2−tR1)/(W1+W2)はどれか。","options":["1.0","0.5","1.5","2.0","4.0"],"answer":3,"explanation":"R=2×(150−120)/(18+12)=60/30=2.0。保持時間の「差」、ピーク幅の「和」を使う。","source":"教材p.235","origin":"写真の出題パターンを踏まえた新規5択","id":106},{"topic":"MS","text":"EI法とESI法の違いとして適切なものはどれか。","options":["両方とも化学発光の検出のみ","EI＝高真空下で電子照射、ESI＝高電圧の帯電液滴からイオン生成","EI＝電極pH、ESI＝GC固定相","EI＝水素化物発生、ESI＝炎光発光","EI＝ガラスセル、ESI＝石英セル"],"answer":1,"explanation":"EIは真空中の電子衝突、ESIは液体試料の帯電噴霧・脱溶媒。壊れやすい分子への適性も異なる。","source":"教材p.221–225","origin":"写真の出題パターンを踏まえた新規5択","id":107},{"topic":"MS","text":"APCIについて適切なものはどれか。","options":["試料を磁気共鳴でイオン化","常に低圧水銀ランプを使う","大気圧下でコロナ放電を用いイオン化","質量分離部で常に電子捕獲する","溶液に必ず過マンガン酸塩を加える"],"answer":2,"explanation":"大気圧化学イオン化APCIはコロナ放電で溶媒等の反応イオンを作り、試料のイオン化に利用。","source":"教材p.221–225","origin":"写真の出題パターンを踏まえた新規5択","id":108},{"topic":"MS","text":"選択イオン検出（SIM）に関する正しい記述はどれか。","options":["あらかじめ決めたm/zのイオン信号を監視する","常に全m/zを走査する","前駆体イオンと生成物イオンを必ず同時選択","GCの移動相線速度を変える","保持時間のみで元素を確定"],"answer":0,"explanation":"SIMは特定m/zを監視して感度を高める。一方、全イオン走査は幅広い質量範囲を測定。","source":"教材p.222–225","origin":"写真の出題パターンを踏まえた新規5択","id":109},{"topic":"MS","text":"SRM（選択反応モニタリング）に相当する測定はどれか。","options":["特定前駆体イオンを選び、その生成物イオンを選択・監視","試料液のpHだけを連続測定","可視吸光度の検量線を作成","窒素ガスの熱伝導率を測定","XRFのFP法で組成推定"],"answer":0,"explanation":"タンデムMSでは前駆体イオンを選別→衝突解離→特定生成物イオンを監視する。","source":"教材p.222–224、238–239","origin":"写真の出題パターンを踏まえた新規5択","id":110},{"topic":"MS","text":"プロダクトイオンスキャンとSRMの違いとして正しいものはどれか。","options":["両者は別名のpH測定","SRMではイオンをまったく作らない","プロダクトイオンスキャンは前駆体を選択し生成物を走査、SRMは選んだ生成物を重点的に監視","プロダクトイオンスキャンではMSを使わない","両者ともクロマトグラフの分離度のみ"],"answer":2,"explanation":"第一質量分析部で前駆体を選択し、生成物の監視方法（走査か特定遷移か）が違う。","source":"教材p.222–225","origin":"写真の出題パターンを踏まえた新規5択","id":111},{"topic":"MS","text":"m/z=75の二価イオン（電荷数z=2）が与えられたとき質量数に相当する値はいくつか（電荷による小さな質量差は無視）。","options":["37.5","300","150","75","100"],"answer":2,"explanation":"m/z=m÷zなのでm=75×2=150。電荷数を掛け戻す。","source":"教材p.222–225","origin":"写真の出題パターンを踏まえた新規5択","id":112},{"topic":"MS","text":"飛行時間型MSで、同一加速電圧と同一電荷数なら質量の大きいイオンの飛行時間はどうなるか。","options":["必ず一定","質量と無関係に負になる","長くなる","ゼロになる","短くなる"],"answer":2,"explanation":"同じ運動エネルギーqVのとき速度v∝1/√m、飛行時間t∝√m。","source":"教材p.223–225","origin":"写真の出題パターンを踏まえた新規5択","id":113},{"topic":"MS","text":"質量分析に関する説明で誤っているものはどれか。","options":["質量分析では質量電荷比を分離の指標に使う","EIでフラグメントが生じることがある","質量スペクトルだけで鏡像異性体の絶対配置を常に一意に決められる","正イオンと負イオンのどちらも測定法によって扱える","ESIは高分子にも応用される"],"answer":2,"explanation":"通常の質量スペクトルのみでは鏡像異性体の絶対配置は決定できない。キラル分離や別の情報が必要。","source":"教材p.221–225","origin":"写真の出題パターンを踏まえた新規5択","id":114},{"topic":"MS","text":"GC/MSの装置内で通常先に行われるものはどれか。","options":["GCで成分を分離→イオン化して質量分析","ICP発光→ろ過のみ","滴定→常にGC分離","質量分析計で分離→GCで保持時間決定","分光光度測定→質量電荷比分離"],"answer":0,"explanation":"GCで保持時間により成分を分離し、MSでイオン化しm/zに応じて分離・検出する。","source":"教材p.221–225、235–240","origin":"写真の出題パターンを踏まえた新規5択","id":115},{"topic":"IC・ISE・流れ","text":"イオンクロマトグラフで電気伝導度検出を行う場合のサプレッサーの機能として適切なのはどれか。","options":["溶離液由来の背景導電率を抑えて目的イオンの検出感度を上げる","窒素を酸素へ酸化する","GCの保持時間を二倍にする","金属イオンを蒸発させる","紫外線を発生させる"],"answer":0,"explanation":"溶離液の導電率を下げることで信号対雑音比を改善。陰イオン分離では陽イオン交換型を使うことが多い。","source":"教材p.191–197、234","origin":"写真の出題パターンを踏まえた新規5択","id":116},{"topic":"IC・ISE・流れ","text":"陰イオンのイオンクロマトグラフで一般的な分離カラムはどれか。","options":["GCの固定相だけ","陰イオン交換樹脂を利用","陽イオン交換樹脂のみ","石英の吸収セル","銀鏡反応面"],"answer":1,"explanation":"陰イオン分離には陰イオン交換作用を利用するカラムが基本。サプレッサーとは役割が違う。","source":"教材p.191–197、234","origin":"写真の出題パターンを踏まえた新規5択","id":117},{"topic":"IC・ISE・流れ","text":"イオン選択性電極について正しいものはどれか。","options":["すべてのイオンを同じ感度で検出","GCのカラムを構成する","特定イオンの活量に応じて膜電位が変化する","外部の中空陰極ランプが必須","全イオン濃度を保持時間で分離"],"answer":2,"explanation":"ISEは膜と試料のイオン活量の関係から電位差を読み取る。ネルンスト式が基礎。","source":"教材p.196–197、241–243","origin":"写真の出題パターンを踏まえた新規5択","id":118},{"topic":"IC・ISE・流れ","text":"25℃で一価イオンのネルンスト応答の絶対値に近いものはどれか（10倍活量変化あたり）。","options":["約120 mV","約15 mV","約30 mV","約6 mV","約59 mV"],"answer":4,"explanation":"25℃で理論的に2.303RT/F≈59.2 mV。二価は約29.6 mV。符号はイオンと電極による。","source":"教材p.241–243","origin":"写真の出題パターンを踏まえた新規5択","id":119},{"topic":"IC・ISE・流れ","text":"25℃で二価イオン電極の応答こう配の絶対値として典型的なのはどれか。","options":["約15 mV","約30 mV","約120 mV","約3 mV","約59 mV"],"answer":1,"explanation":"ネルンスト式のこう配は電荷数の絶対値に反比例するため、二価は約30 mV/decade。","source":"教材p.241–243","origin":"写真の出題パターンを踏まえた新規5択","id":120},{"topic":"IC・ISE・流れ","text":"フローインジェクション分析（FIA）の説明として適切なのはどれか。","options":["気体分節を必須とする","試料を一度強熱してから分析","連続流れへ一定量の試料を注入し、流れの中で混合・反応して下流で検出する","GCでのみ使用できる","分析対象の分離が必ず質量で行われる"],"answer":2,"explanation":"FIAでは試料を一定体積注入し、キャリヤーや試薬と混合し下流検出器でピークを測る。","source":"教材p.243–248","origin":"写真の出題パターンを踏まえた新規5択","id":121},{"topic":"IC・ISE・流れ","text":"連続流れ分析（CFA）の気体分節の主な役割はどれか。","options":["流れを分節し試料と試料の混ざりを抑え、混合操作を制御する","試料の乾燥を促す","紫外線を生成する","GCの液体固定相を除く","試料を気体として必ず検出"],"answer":0,"explanation":"連続流れ分析では気体で液流を区切り、分節による混合・キャリーオーバー抑制などを行う。","source":"教材p.244–248","origin":"写真の出題パターンを踏まえた新規5択","id":122},{"topic":"IC・ISE・流れ","text":"FIAとCFAの違いについて誤っているものはどれか。","options":["FIAは必ず気体で細管を分節しなければならない","両者とも反応・混合操作を流路内で行える","どちらも下流の検出器で信号を得る","CFAには分節気体を利用する方式がある","FIAでは注入ループなどで一定体積を導入する"],"answer":0,"explanation":"FIAは通常、試料ゾーンを流れへ導入する非分節方式。気体分節を必須とするのは誤り。","source":"教材p.244–248","origin":"写真の出題パターンを踏まえた新規5択","id":123},{"topic":"IC・ISE・流れ","text":"FIAのピーク高さに関して正しいものはどれか。","options":["試料流量に無関係であることが保証される","一定条件下では目的成分濃度との応答関係で定量に使える","GC理論段数だけで求まる","試料がないときだけ現れる","常にpHそのものを示す"],"answer":1,"explanation":"濃度とピーク高さ（または面積）の関係を校正し、流れ分析で定量可能。流速・反応条件も影響する。","source":"教材p.246–248","origin":"写真の出題パターンを踏まえた新規5択","id":124},{"topic":"IC・ISE・流れ","text":"イオンクロマトの分離度Rに関して正しいものはどれか。","options":["検出器の電圧だけで決まる","サプレッサーの存在だけでR=0","常にピーク面積の和に等しい","保持時間差とピーク幅に依存する","カラム長とは無関係に決まる"],"answer":3,"explanation":"分離度R=2ΔtR/(W1+W2)（基線幅の場合）。分離状態を表す指標。","source":"教材p.234–235","origin":"写真の出題パターンを踏まえた新規5択","id":125},{"topic":"個別物質","text":"PCBのGC分析でハロゲン含有化合物に対する感度から選ばれる代表的な検出器はどれか。","options":["FPD","TCD","ECD","電位差計","ICP-OES"],"answer":2,"explanation":"PCBは多数の塩素を含むためECDに高感度応答する。教材のPCB設問にもECDが登場する。","source":"教材p.235–237","origin":"写真の出題パターンを踏まえた新規5択","id":126},{"topic":"個別物質","text":"PFOS/PFOAの教材掲載法に適するイオン化法と分析器の組合せはどれか。","options":["EIを用いるGC-FID","TCDを用いるGCのみ","ESIを用いるLC-MS/MS","FIDを用いるIC","原子吸光の中空陰極ランプのみ"],"answer":2,"explanation":"PFOS/PFOAはLC-MS/MSでESIを用いる方法が出題。SRM/MRMで定量する。","source":"教材p.238–239","origin":"写真の出題パターンを踏まえた新規5択","id":127},{"topic":"個別物質","text":"フタル酸エステル測定で避けるべき前処理はどれか。","options":["不用意な強酸による分解","器具由来汚染の点検","固相抽出","GC/MS定量","溶媒抽出"],"answer":0,"explanation":"フタル酸エステルは器具・試薬由来汚染への注意が必要で、教材の方法では塩酸・硝酸による分解を適用しない。","source":"教材p.240–241","origin":"写真の出題パターンを踏まえた新規5択","id":128},{"topic":"個別物質","text":"フェノール類の試料保存として教材に示された組合せはどれか。","options":["NaOHでpH13のみ","りん酸でpH約4、硫酸銅(II)を添加し冷暗所保存","硝酸でpH1にし強熱","無処理で1週間直射日光","塩素を多量に加え沸騰"],"answer":1,"explanation":"フェノール類はりん酸でpH約4、硫酸銅(II)を加え冷暗所保存する設問。","source":"教材p.193","origin":"写真の出題パターンを踏まえた新規5択","id":129},{"topic":"個別物質","text":"アクロレインのヘキシルレゾルシノール吸光光度法に関する出題内容として正しいものはどれか。","options":["試料採取は気体吸収法を使わない","GC分析ではECD以外が禁止","共存妨害は1000 ppm以下なら皆無","試料は強熱乾固だけでよい","オゾン等が約10 volppm共存すると妨害を受けることがある"],"answer":4,"explanation":"教材にはオゾンまたはジエン類の約10 volppm共存が妨害になると記載。桁のひっかけに注意。","source":"教材p.186–187","origin":"写真の出題パターンを踏まえた新規5択","id":130},{"topic":"個別物質","text":"ヘッドスペースGC-ECDによる揮発性有機塩素化合物の測定について、適用対象として不適切なものはどれか。","options":["四塩化炭素","ベンゼン","トリクロロエチレン","ジクロロメタン","クロロホルム"],"answer":1,"explanation":"ECDは塩素を含む揮発性有機物へ応答しやすい。ベンゼンは塩素を含まず、この組合せの対象として適さない。","source":"教材p.237","origin":"写真の出題パターンを踏まえた新規5択","id":131},{"topic":"個別物質","text":"ダイオキシン類のGC-MS分析に関して正しいものはどれか。","options":["測定にクロマトグラフは無関係","においから質量濃度を直接算出","試料の希釈は一切認められない","FIDで水素炎の色だけを測る","分解能・質量選択性と適切な標準物質による確認が重要"],"answer":4,"explanation":"ダイオキシン類は選択性の高いGC-MS測定と適切な同定・定量手順が重要。","source":"教材p.185–189","origin":"写真の出題パターンを踏まえた新規5択","id":132},{"topic":"個別物質","text":"水質試験における「全りん」の測定で、りん酸イオン以外も対象とするため必要な操作はどれか。","options":["測定対象を分解せず必ずFIDへ注入","試料をGCキャピラリーへ直接注入","有機態・縮合態などを酸化分解してりん酸へ","全りんはpHだけで決まる","金属のみを沈殿させる"],"answer":2,"explanation":"全りんは有機態・縮合態などを含め分解して測定。りん酸イオンそのものと「全りん」の区別。","source":"教材p.202–203","origin":"写真の出題パターンを踏まえた新規5択","id":133},{"topic":"環境・校正","text":"校正用ガスのゼロガスとスパンガスの使い分けとして正しいものはどれか。","options":["ゼロガス＝最大目盛付近、スパンガス＝ゼロ点","両者は定量に無関係","ゼロガスは必ず濃厚水素","どちらも試薬を加える液体","ゼロガス＝ゼロ点、スパンガス＝測定範囲上側の感度・指示値の確認"],"answer":4,"explanation":"ゼロガスはゼロ点、スパンガスは所定測定範囲の上端寄りの校正に用いる。中間点ガスとの区別。","source":"教材p.250–252","origin":"写真の出題パターンを踏まえた新規5択","id":134},{"topic":"環境・校正","text":"校正用ガスを分析計へ導く配管について正しい設計方針はどれか。","options":["必ず試料流路と異なる圧力で送る","毎回結露させる","ガスが漏れてもよい","なるべく短く、吸着・反応・透過が小さい適切な材質を使う","なるべく長く、吸着性素材を選ぶ"],"answer":3,"explanation":"配管の死容積・吸着・反応・漏えい・透過は校正値に影響。短い配管を選ぶ。","source":"教材p.249–252","origin":"写真の出題パターンを踏まえた新規5択","id":135},{"topic":"環境・校正","text":"ガス分析装置の設置環境として避けるべきものはどれか。","options":["定期点検しやすい場所","振動や電源変動が大きい場所","温度変動の少ない室","防じんに配慮した場所","安定した電源"],"answer":1,"explanation":"振動、温度変動、電源の不安定さはゼロドリフトや再現性悪化を招く。","source":"教材p.249–251","origin":"写真の出題パターンを踏まえた新規5択","id":136},{"topic":"環境・校正","text":"水質環境基準の教材掲載値について、正しい組合せはどれか（教材掲載当時）。","options":["Pb 0.10 mg/L以下","Cd 0.003 mg/L以下","Cr(VI) 0.5 mg/L以下","総水銀 0.01 mg/L以下","As 0.10 mg/L以下"],"answer":1,"explanation":"教材記載はCd 0.003、As 0.01、Pb 0.01、総Hg 0.0005 mg/L以下。基準値は改正され得るため現行法令の確認が必要。","source":"教材p.248–250","origin":"写真の出題パターンを踏まえた新規5択","id":137},{"topic":"環境・校正","text":"水質環境基準の総水銀の教材掲載値として正しいものはどれか。","options":["0.005 mg/L以下","0.05 mg/L以下","0.5 mg/L以下","0.0005 mg/L以下","5 mg/L以下"],"answer":3,"explanation":"教材掲載の総水銀は0.0005 mg/L以下。「0.01 mg/L」は誤り。現行基準との照合にも注意。","source":"教材p.248–250","origin":"写真の出題パターンを踏まえた新規5択","id":138},{"topic":"環境・校正","text":"計測器で「測光正確さ」と「波長正確さ」を区別した説明として正しいものはどれか。","options":["波長正確さはpHの正確さ","測光正確さはGC保持時間のみ","両者ともガス圧のみ","測光正確さは透過率・吸光度の正確さ、波長正確さは波長目盛の正確さ","両者は同じ単位の電気伝導率"],"answer":3,"explanation":"測光正確さは光の量（吸光度等）の指示の適切さ、波長正確さは分析線の波長位置の指示の適切さ。","source":"教材p.204–208","origin":"写真の出題パターンを踏まえた新規5択","id":139},{"topic":"環境・校正","text":"次の採取器と用途の対応として正しいものはどれか。","options":["キャニスター＝空気中のVOC等の採取","エクマンバージ採泥器＝排ガス採取","ハイボリウムエアサンプラ＝溶存酸素直接定量","ハイロート採水器＝大気中粉じん採取","サーバーネット＝燃料ガス採取"],"answer":0,"explanation":"キャニスターは空気中の揮発性有機化合物等のガス採取。ハイボリウムは浮遊粒子、ハイロートは採水、エクマンは底質、サーバーネットは水域生物等。","source":"教材p.249","origin":"写真の出題パターンを踏まえた新規5択","id":140},{"topic":"環境・校正","text":"硝酸酸性で保存する金属元素の試料とシアン測定試料の区別として正しいものはどれか。","options":["どちらもpH1が無条件に適切","金属＝酸性条件の例がある、シアン＝アルカリ性条件を要する","どちらもpH13が無条件に適切","どちらも必ず冷凍して強熱","どちらも環境により化学形が変わらない"],"answer":1,"explanation":"金属（溶存態・全量）とシアン・Cr(VI)等では対象成分と保存化学形が異なる。","source":"教材p.189–201","origin":"写真の出題パターンを踏まえた新規5択","id":141},{"topic":"環境・校正","text":"校正で測定レンジの中央付近の指示値を確認するものはどれか。","options":["キャリヤーガスのみ","スパンガスのみ","吸収液のみ","中間点ガス","ゼロガス"],"answer":3,"explanation":"ゼロガスはゼロ点、スパンガスは上限側、中間点ガスはその間の応答を確認。","source":"教材p.250–252","origin":"写真の出題パターンを踏まえた新規5択","id":142}];
const storeKey='env_keiryo_kanno_142_20261028';
let results={};try{results=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){}
let subset=[],cursor=0,visibleAnswer=false,sessionChoice={};
const E=(id)=>document.getElementById(id);
const safe=(s)=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function record(){try{localStorage.setItem(storeKey,JSON.stringify(results))}catch(e){}}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function configure(force){const cat=E('cat').value, mode=E('mode').value;
 let list=Q.filter(x=>cat==='all'||x.topic===cat);
 if(mode==='wrong')list=list.filter(x=>results[x.id]?.lastCorrect===false);
 if(mode==='unseen')list=list.filter(x=>!results[x.id]);
 if(mode==='random'||mode==='mock')list=shuffle(list);
 if(mode==='mock')list=list.slice(0,25);
 subset=list;cursor=0;visibleAnswer=false;sessionChoice={};render();}
function stats(){let n=Object.keys(results).length, correct=Object.values(results).filter(x=>x.lastCorrect).length;E('stats').textContent='学習済 '+n+'/'+Q.length+'問  ・  最終正解 '+correct+'問';}
function render(){stats();
 if(!subset.length){E('out').innerHTML='<div class="empty">該当する問題がありません。カテゴリや出題モードを変更してください。</div>';E('position').textContent='0 / 0';E('bar').style.width='0%';return;}
 const a=subset[cursor];if(!a){E('out').innerHTML='<div class="empty">このセットは終了です。もう一度出題してください。</div>';return;}
 const chosen=sessionChoice[a.id];const known=chosen!==undefined;const revealed=known||visibleAnswer;
 let choices=a.options.map((v,i)=>{let cl='choice';if(revealed){if(i===a.answer)cl+=' correct';else if(known&&i===chosen)cl+=' wrong';else cl+=' faded'}return '<button class="'+cl+'" data-n="'+i+'" '+(revealed?'disabled':'')+'><span class="num">'+(i+1)+'</span><span>'+safe(v)+'</span></button>'}).join('');
 let answer='';if(revealed){const judge=!known?'正解を表示':chosen===a.answer?'正解':'不正解';answer=`<div class="answer" aria-live="polite"><div class="headline">${known?(chosen===a.answer?'✓ ':''):''}<strong>正解：${a.answer+1}．${safe(a.options[a.answer])}</strong></div><div class="judgement">${judge}${known?' ・ あなたの回答：'+(chosen+1)+'番':''}</div><div class="explain"><b>解説</b><div>${safe(a.explanation)}</div></div><div class="cite">対応範囲：${safe(a.source)}（学習用オリジナル／過去問題の転載ではありません）</div></div>`}
 E('out').innerHTML=`<section class="question"><div class="qtop"><span class="qnumber">問題 ${a.id} / 全${Q.length}問</span><span class="tag">${safe(a.topic)}</span></div><h2>${safe(a.text)}</h2><div class="choices">${choices}</div>${answer}<div class="after"><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="back" ${cursor===0?'disabled':''}>前の問題</button>${!revealed?'<button id="show">答えと解説を見る</button>':''}</div><button id="next" class="primary">${cursor===subset.length-1?'セット終了':'次の問題へ →'}</button></div><div class="hint">解答すると<strong>その場で</strong>正解と解説を表示。解説を読み終えてから「次の問題へ」。<span class="keyboard"> キーボードの1〜5で解答、→で次へ。</span></div></section>`;
 E('out').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.n))));
 if(E('show'))E('show').onclick=()=>{visibleAnswer=true;render()};
 E('back').onclick=()=>{if(cursor>0){cursor--;visibleAnswer=false;render();window.scrollTo({top:0,behavior:'smooth'})}};
 E('next').onclick=()=>{if(cursor>=subset.length-1){E('out').innerHTML=`<div class="empty"><h2>このセットは終了です</h2><p>${subset.length}問を表示しました。間違えた問題だけの復習もできます。</p><button class="primary" onclick="configure(true)">同じ条件で再出題</button></div>`;E('position').textContent='終了';E('bar').style.width='100%'}else{cursor++;visibleAnswer=false;render();window.scrollTo({top:0,behavior:'smooth'})}};
 E('position').textContent=(cursor+1)+' / '+subset.length;E('bar').style.width=((cursor+1)/subset.length*100)+'%';}
function choose(i){if(!subset.length)return;const a=subset[cursor];if(sessionChoice[a.id]!==undefined||visibleAnswer)return;sessionChoice[a.id]=i;results[a.id]={lastCorrect:i===a.answer,attempts:(results[a.id]?.attempts||0)+1};record();render();}
E('cat').innerHTML='<option value="all">全分野</option>'+[...new Set(Q.map(x=>x.topic))].map(c=>`<option value="${safe(c)}">${safe(c)}（${Q.filter(x=>x.topic===c).length}問）</option>`).join('');
E('run').onclick=()=>configure(true);E('reset').onclick=()=>{if(confirm('このブラウザに記録した解答履歴を消去しますか？')){results={};record();configure(true)}};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key>='1'&&e.key<='5'){choose(Number(e.key)-1)}else if(e.key==='ArrowRight'){const b=E('next');if(b)b.click()}});
configure(true);
</script></body></html>
