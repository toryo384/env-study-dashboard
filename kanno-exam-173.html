<style>

<script>
'use strict';
const DB=[{"n":1,"page":126,"prompt":"H形の陽イオン交換樹脂0.50 g（乾燥質量）をカラムに詰めた。そこにNaCl水溶液を十分に流してH⁺をすべて溶出させた。この溶出液の全量を0.20 mol/LのNaOH水溶液で滴定したところ、中和するのに10 mLを要した。このとき、単位質量当たりの樹脂が保持していたH⁺の物質量として最も近いものを一つ選べ。","options":["0.25 mmol/g","0.50 mmol/g","1.0 mmol/g","2.0 mmol/g","4.0 mmol/g"],"answer":5,"brief":"0.20 mol/L×0.010 L＝0.0020 mol＝2.0 mmol。樹脂0.50 g当たりなので2.0/0.50＝4.0 mmol/g。","confidence":"checked"},{"n":2,"page":126,"prompt":"10 mmol/Lの塩酸100 mLに10 mmol/Lの水酸化ナトリウム水溶液50 mLを加えたとき、溶液中の水素イオン濃度として最も近いものを一つ選べ。なお、操作は室温で行い、温度上昇は無視する。","options":["1.3 mmol/L","2.3 mmol/L","3.3 mmol/L","4.3 mmol/L","5.0 mmol/L"],"answer":3,"brief":"塩酸1.0 mmolに対して、NaOHは0.50 mmol。中和後に残るH⁺は0.50 mmol。全体積150 mLなので0.50/0.150＝3.3 mmol/L。","confidence":"checked"},{"n":3,"page":127,"prompt":"CuSO₄·5H₂O 0.10 gを水に溶かして1.0 Lとした。BaCl₂を少しずつ加えるとき、BaSO₄が析出し始めるBa²⁺濃度に最も近いものはどれか。BaSO₄の溶解度積は1.1×10⁻¹⁰、CuSO₄·5H₂Oのモル質量は249.6 g/molとする。","options":["8.8×10⁻⁸ mol/L","1.4×10⁻⁷ mol/L","1.8×10⁻⁷ mol/L","2.7×10⁻⁷ mol/L","3.5×10⁻⁷ mol/L"],"answer":4,"brief":"[SO₄²⁻]＝0.10/249.6＝4.0×10⁻⁴ mol/L。Ksp＝[Ba²⁺][SO₄²⁻]なので[Ba²⁺]＝2.75×10⁻⁷ mol/L。","confidence":"rewritten"},{"n":4,"page":128,"prompt":"成分Aを10 mg/L含む水溶液100 mLに、成分Bの質量分率が90%の試薬を添加する。AとBの質量濃度を等しくするには、Bを含む試薬を何mg加える必要があるか。体積変化は無視する。","options":["約0.1 mg","約0.9 mg","約10 mg","約1.1 mg","約100 mg"],"answer":4,"brief":"Aの質量は10 mg/L×0.100 L＝1.0 mg。Bの試薬は純度90%なので1.0÷0.90＝約1.11 mg。","confidence":"rewritten"},{"n":5,"page":128,"prompt":"100 mLの水相に溶質1.0 mmolが含まれる。分配比（有機相濃度／水相濃度）が20の有機溶媒20 mLで1回抽出すると、有機相へ移る溶質量はどれか。","options":["0.10 mmol","0.20 mmol","0.50 mmol","0.80 mmol","0.95 mmol"],"answer":4,"brief":"有機相へ移る割合＝D×V有機／(V水＋D×V有機)＝20×20／(100＋20×20)＝0.80。","confidence":"rewritten"},{"n":6,"page":129,"prompt":"ある量のアンモニアを0.10 mol/Lの硫酸200 mLに完全に吸収させた後、メチルレッドを指示薬として0.10 mol/Lの水酸化ナトリウム水溶液で滴定したところ、滴定終点までの滴定量は300 mLであった。吸収させたアンモニアの標準状態における体積（L）として、最も近いものを一つ選べ。なお、滴定終点は中和反応の当量点に一致し、アンモニアは理想気体とする。標準状態でのモル体積は22.4 L/molとする。","options":["0.11 L","0.22 L","0.45 L","0.67 L","0.90 L"],"answer":2,"brief":"硫酸0.020 IS K 0090）― 吸収瓶法","メルカプタン（JIS K 0092）― 真空捕集瓶法","ホルムアルデヒド（JIS K 0303）― 捕集バッグ法"],"answer":5,"brief":"ホルムアルデヒドはこの規格の方法では捕集バッグ法ではなく、捕集管で捕集・誘導体化する方法が用いられる。","confidence":"checked"},{"n":41,"page":155,"prompt":"排ガスを採取し連続分析で複数成分を測る際の、基本的な流路の順序として適切なのはどれか。","options":["採取管 → 前処理・除湿 → 分岐管 → 各分析計","分岐管 → 煙道 → 採取管 → 分析計","分析計 → 採取管 → 除湿器","各分析計 → 共通煙道 → 分岐管","分析計 → 採取管 → フィルタ"],"answer":1,"brief":"採取後、必要な前処理を経て分岐し、各分析計へ試料を供給する。成分ごとの適切な採取系は確認が必要。","confidence":"rewritten"},{"n":42,"page":155,"prompt":"「JIS K 0095 排ガス試料採取方法」における試料ガス採取位置について、次の文の（ア）～（ウ）に入る語句の組合せとして正しいものを選べ。\n試料ガスの採取位置には、ダクトの（ア）部分、断面形状の（イ）部分などを避け、排ガスの流れが比較的一様に（ウ）、作業が安全かつ容易な場所を選ぶ。","options":["直線／急激に変化する／整流され","直線／均一な／乱され","直線／急激に変化する／乱され","屈曲／均一な／乱され","屈曲／急激に変化する／整流され"],"answer":5,"brief":"ダクトの屈曲部や断面形状が急に変化する部分では、流速分布に偏りが生じやすい。排ガスの流れが整流され、試料を代表性よく採取できる位置を選ぶ。","confidence":"checked"},{"n":43,"page":156,"prompt":"排ガス分析の汚染物質と吸収液の組合せとして適切なのはどれか。","options":["硫黄酸化物 ― 無水エタノールのみ","塩化水素 ― トルエン","ふっ素化合物 ― ヘキサンのみ","アンモニア ― 強アルカリ溶液のみ","アンモニア ― ほう酸溶液"],"answer":5,"brief":"アンモニアは酸性側でアンモニウムイオンにして捕集でき、ほう酸溶液などを用いる。","confidence":"rewritten"},{"n":44,"page":157,"prompt":"硫黄酸化物（SOx）のイオンクロマトグラフ法に関する説明で誤っているものはどれか。","options":["過酸化水素を含む吸収液でSO₂を酸化・捕集できる。","主に硫酸イオンとして定量する。","共存成分による妨害の有無を検討する。","吸収液をICへ導入して分離定量する。","SOxはすべて硫化物イオンとして検出する。"],"answer":5,"brief":"SO₂などを吸収酸化してSO₄²⁻として定量する。","confidence":"rewritten"},{"n":45,"page":157,"prompt":"SOxのイオンクロマトグラフ法の操作として誤っているものはどれか。","options":["酸化剤を含む吸収液を用いる。","硫酸イオンのピークを定量に使う。","吸収液中で硫黄酸化物をチオ硫酸イオンに定量的に変換する。","試薬空試験を考慮する。","対象範囲に応じて適切な校正を行う。"],"answer":3,"brief":"硫黄酸化物を硫酸イオンに変えて定量する方法であり、チオ硫酸イオンとして定量しない。","confidence":"rewritten"},{"n":46,"page":158,"prompt":"二酸化硫黄の溶液導電率式自動計測器について、吸収液・生成物・妨害物質の適切な組合せはどれか。","options":["過酸化水素 ― 硫化水素 ― ベンゼン","過酸化水素 ― 硫酸 ― アンモニア","アスコルビン酸 ― 硫酸 ― アンモニア","水酸化ナトリウム ― 硫化物 ― 二酸化炭素","純水 ― 硫化水素 ― 酸素"],"answer":2,"brief":"SO₂は過酸化水素に吸収され酸化されて硫酸を生じ、電気伝導率が上昇する。NH₃のような塩基性物質は妨害となる。","confidence":"rewritten"},{"n":47,"page":158,"prompt":"「JIS B 7953 大気中の窒素酸化物自動計測器」に規定される化学発光方式の計 ,"brief":"イオン選択性電極の膜電位は、対象イオンの活量の対数に応答する。電位と活量の関係を表すのがネルンスト式である。","confidence":"checked"},{"n":54,"page":163,"prompt":"非分散形赤外線（NDIR）ガス分析計の構成について正しいものはどれか。","options":["必ずGCカラムで成分分離してから吸収を測る。","試料セルに試料ガスを流通させ、窓を通過する赤外線の吸収を測定する。","酸素の常磁性だけを利用する。","紫外線だけを光源として用いる。","標準ガスによる校正は不要である。"],"answer":2,"brief":"NDIRは分子の赤外線吸収を利用する。成分ごとの吸収特性・干渉に注意。","confidence":"rewritten"},{"n":55,"page":164,"prompt":"ジルコニア式酸素計の測定原理として正しいものはどれか。","options":["ろ紙上の粒子によるベータ線吸収","水素炎中のイオン電流","窒素酸化物の化学発光","固体電解質を利用した酸素分圧差に基づく起電力","酸素分子のGC保持時間"],"answer":4,"brief":"ジルコニアの酸素イオン伝導性を利用し、酸素分圧の違いによる電位差を測る。","confidence":"rewritten"},{"n":56,"page":166,"prompt":"酸素濃度自動計測器について誤っているものはどれか。","options":["磁気式は酸素の常磁性を利用する。","ジルコニア式は高温の固体電解質を使う。","磁気式には磁気風方式などがある。","磁気式もジルコニア式も、共存ガスの干渉を一律に無視できる。","測定方式に応じて共存成分の影響を評価する。"],"answer":4,"brief":"異なる方式では干渉原因も異なる。測定条件に応じて校正や妨害対策が必要。","confidence":"rewritten"},{"n":57,"page":167,"prompt":"「JIS B 7983 排ガス中の酸素自動計測器」に規定されている計測器に関する記述として、誤っているものを一つ選べ。","options":["磁気式では、常磁性体である酸素を高温で磁化したときに生じる吸引力を利用して測定する。","試料採取部には採取管、粗フィルタ、導管、微フィルタなどがある。","ゼロドリフトは、最小目盛に対する指示値の一定時間内の変動である。","干渉成分の影響を調べる試験用ガスの組成は、磁気風方式とジルコニア方式とで異なる。","ジルコニア方式では、ジルコニア素子を固体電解質として酸素濃淡電池の起電力を検出する。"],"answer":1,"brief":"磁気風方式は、酸素が常磁性を示し、温度上昇で磁化率が低下する性質を利用する。選択肢1は高温で磁化されると説明しており誤り。","confidence":"checked"},{"n":58,"page":168,"prompt":"排ガス中の一酸化炭素（CO）分析について誤っている記述はどれか。","options":["非分散形赤外線方式はCO連続測定に使われる。","GC法でガス試料を分析できる。","採取ライン内での結露を避ける工夫がある。","検知管法も用途に応じて使われる。","GC法では必ずメタン化反応装置付き熱伝導度検出器（TCD）を用いなければならない。"],"answer":5,"brief":"CO分析には複数の測定法がある。メタン化装置はFIDと組み合わせる例があり、TCDに必須ではない。","confidence":"rewritten"},{"n":59,"page":169,"prompt":"「JIS K 0098 排ガス中の一酸化炭素分析方法」に関する次の記述のうち、誤っているものを一つ選べ。","options":["ガスクロマトグラフ法の試料採取には注射筒を用いることができる。","捕集バッグを用いる場合、ガス透過性の大きいバッグを用いることができる。","赤外線吸収法では連続測定ができる。","GC法ではメタン化反応装置と水素炎イオン化検出器を組み合わせることができる。","GC法のカラム充填剤として合成ゼオライトを用いることができる。"],"answer":2,"brief":"捕集バッグには測定成分が外へ透過しにくい材質を用いる。ガス透過性が大きいバッグは試料の組成を変えるため不適切。","confidence":"checked"},{"n":60,"page":169,"prompt":"「JIS B 7954 大気中の浮遊粒子状物質自動計 ":"ホルムアルデヒド標準液の濃度を化学的に求める際に用いられる反応として適切なのはどれか。","options":["アルデヒドの酸化反応を利用して消費した試薬量を滴定する。","気体をろ紙へ静電捕集する。","酸素分圧差の起電力を測る。","電子捕獲検出器だけで標準液を秤量する。","炎光光度検出器で硫黄を測る。"],"answer":1,"brief":"ホルムアルデヒドの標定には、反応試薬の消費量を求める滴定法などが用いられる。","confidence":"rewritten"},{"n":68,"page":175,"prompt":"排ガス中のホルムアルデヒド分析で誤っている説明はどれか。","options":["DNPH法ではカルボニル基と誘導体化試薬を反応させる。","採取時にダストの混入防止を考慮する。","HPLCでDNPH誘導体を測定する方法がある。","採取条件が試料の回収率に影響する。","DNPHで誘導体化した試料は、どの分析法でも前処理せずGC-FIDだけで測定する。"],"answer":5,"brief":"DNPH誘導体はHPLCによる定量が代表的。GC-FIDのみが必須というわけではない。","confidence":"rewritten"},{"n":69,"page":176,"prompt":"排ガス中のシアン化水素（HCN）を吸収捕集する場合に適切な考え方はどれか。","options":["強酸性にしてHCNを積極的に揮散させる。","水素炎で直接粒子数を数える。","アルカリ性の吸収液でCN⁻として保持し揮散を抑える。","試料を高温乾固させてから採取する。","磁気風方式でシアン化物イオンを測る。"],"answer":3,"brief":"HCNは弱酸のためアルカリ性でCN⁻へ移し、気相への揮散を抑えて捕集できる。","confidence":"rewritten"},{"n":70,"page":177,"prompt":"「JIS K 0109 排ガス中のシアン化水素分析方法」の吸光光度法及びガスクロマトグラフ法について、正しいものを一つ選べ。","options":["吸光光度法では、吸収液として硫酸－過酸化水素水を用いる。","吸光光度法では、4-アミノアンチピリン溶液で発色させる。","ガスクロマトグラフ法では、熱イオン化検出器を使用する。","ガスクロマトグラフ法と吸光光度法では、同じ試料採取方法を用いる。","ガスクロマトグラフ法の定量範囲は、吸光光度法より狭い。"],"answer":3,"brief":"GC法では熱イオン化検出器を使用する。吸光光度法は水酸化ナトリウム溶液に吸収させ、4-ピリジンカルボン酸－ピラゾロン溶液で発色する。試料採取方法と定量範囲も両法で異なる。","confidence":"checked"},{"n":71,"page":178,"prompt":"排ガス中アンモニア（NH₃）の捕集法について適切なのはどれか。","options":["強塩基性の吸収液でアンモニアをすべて安定保持する。","GC-ECDで窒素分子として測る。","酸性の吸収液でNH₄⁺として捕集する。","石英ガラスへ沈着した粉じんだけを秤量する。","酸素計の起電力から求める。"],"answer":3,"brief":"NH₃は塩基性であり、酸性吸収液によりNH₄⁺として保持できる。","confidence":"rewritten"},{"n":72,"page":179,"prompt":"アンモニアの吸光光度分析で、測定対象の化学種に適切なのはどれか。","options":["試料中の窒素分子のみ","オゾンとの発光を示すNOのみ","吸収液中のアンモニウムイオンなどに変換されたアンモニア由来成分","ベータ線吸収で求めた粒子質量のみ","酸素分圧差のみ"],"answer":3,"brief":"NH₃を吸収液へ移し、発色反応などで定量する方法が用いられる。","confidence":"rewritten"},{"n":73,"page":180,"prompt":"排ガス中のふっ素化合物をイオンクロマトグラフ法で測るとき、主に定量するイオンはどれか。","options":["塩化物イオン Cl⁻","硫酸イオン SO₄²⁻","硝酸イオン NO₃⁻","ふっ化物イオン F⁻","アンモニウムイオン NH₄⁺"],"answer":4,"brief":"フッ素化合物を吸収液に捕集し、ふっ化物イオンとしてICで測る。","confidence":"rewritten"},{"n":74,"page":180,"prompt":"排ガス中メタンを測る装置に適した検出原理として代表的なものはどれか。","options":["ベータ線吸収法","ジルコニア酸素電池","イオン選択性電極法","水素炎イオン化検出法（FID）","ゼーマン原子吸光法"],"answer":4,"brief":"メタンは有機炭素を含む可燃性ガスで、FIDにより測定できる。","confidence":"rewritten"},{"n":75,"page":181,"prompt":"揮発性有機化合物（VOC）の検知管法の原理として正しいものはどれか。","options":["試料ガスを検知管に通じ、試薬の反応で生じる変色長などから濃度を読む。","検知管を炎中で原子化しICP発光を測る。","液体クロマトグラフの保持時間から求める。","水素イオンの起電力を直接測る。","電子イオン化でm/zを測る。"],"answer":1,"brief":"検知管は充填された発色試薬と気体成分の反応を利用する。温度・共存ガス・採取量に注意。","confidence":"rewritten"},{"n":76,"page":182,"prompt":"排ガス中のVOCを捕集バッグで採取して測定する際、誤っている記述はどれか。","options":["試料採取系の漏れを防止する。","採取容器の材質による吸着を考慮する。","採取後はできるだけ速やかに測定する。","適切な捕集量を確保する。","バッグ内の試料ガスは長期保存しても濃度が必ず変化しない。"],"answer":5,"brief":"VOCはバッグ材への吸着、透過、化学反応によって濃度が変化し得る。長期保存を無条件に認めない。","confidence":"rewritten"},{"n":77,"page":182,"prompt":"メタン自動計測器の取扱いで誤っているものはどれか。","options":["測定レンジを考慮して校正ガスを選ぶ。","試料採取系の気密性を確認する。","共存物質の干渉を評価する。","適切なガス流量を保つ。","校正ガスの濃度や供給流量は測定値に無関係なので確認不要である。"],"answer":5,"brief":"装置の校正と試料供給条件は測定の正確さに直結する。","confidence":"rewritten"},{"n":78,"page":183,"prompt":"排ガス中VOCをFID方式で測定するときの留意点として正しいものはどれか。","options":["FIDはすべての有機物に厳密に同じ応答を示す。","酸素の常磁性からVOCを直接定量する。","炭化水素の種類により感度が異なるため、校正ガスや換算係数を考慮する。","気体採取系での吸着や結露は影響しない。","校正に純水だけを用いる。"],"answer":3,"brief":"FIDは有機炭素に広く応答するが化合物ごとの応答は異なる。","confidence":"rewritten"},{"n":79,"page":184,"prompt":"排ガス中フェノール類の測定について、適切な説明はどれか。","options":["フェノール類は吸収液等に捕集して発色・機器分析で定量できる。","フェノール類の定量には酸素濃淡電池だけを使う。","フェノール類は無機陰イオンなのでICだけで直接測る。","粒子状物質のベータ線吸収で必ず定量する。","GCの電子捕獲検出器が必須である。"],"answer":1,"brief":"フェノール類は有機化合物であり、捕集・前処理と適切な発色法や機器分析法を組み合わせる。","confidence":"rewritten"},{"n":80,"page":184,"prompt":"排ガス中POPs（PCB等）の測定で誤っているものはどれか。","options":["捕集器具の洗浄や空試験が重要である。","有機溶媒抽出や精製が行われる。","GC/MSで対象物質を分析できる。","採取から定量までの回収率管理が必要である。","測定前処理におけるブランク汚染の影響は無視してよい。"],"answer":5,"brief":"POPsは極微量分析となるため、採取装置由来の汚染と操作ブランクを厳しく管理する。","confidence":"rewritten"},{"n":81,"page":185,"prompt":"排ガス中ベンゼンの測定法に関係する機器として適切なのはどれか。","options":["ジルコニア式酸素電極のみ","水質用イオン選択電極のみ","浮遊粒子状物質のベータ線検出器のみ","pHガラス電極のみ","ガスクロマトグラフ（GC）"],"answer":5,"brief":"ベンゼンは揮発性有機化合物でありGCによる分離分析の対象となる。","confidence":"rewritten"},{"n":82,"page":186,"prompt":"有機ハロゲン化合物に高い感度を示すGC検出器はどれか。","options":["熱伝導度検出器（TCD）のみ","水素炎イオン化検出器（FID）のみ","蛍光X線検出器","酸素濃淡電池","電子捕獲検出器（ECD）"],"answer":5,"brief":"ECDは電気陰性度の高い化合物、特に有機ハロゲン化合物の検出に適する。","confidence":"rewritten"},{"n":83,"page":186,"prompt":"アクロレインのような反応性の高いカルボニル化合物の測定で、不適切な考え方はどれか。","options":["捕集・誘導体化条件を適切に管理する。","標準液の安定性に注意する。","採取後の化学変化や損失は起こらないため保存条件を考慮しない。","採取系での吸着や反応を検討する。","目的成分に適した分離定量法を用いる。"],"answer":3,"brief":"反応性のあるアルデヒド類では、採取・保存・前処理の間の変化を考慮する必要がある。","confidence":"rewritten"},{"n":84,"page":187,"prompt":"「JIS K 0312 工業用水・工場排水中のダイオキシン類の測定方法」の試料容器・採取操作について、下線部（a）～（c）の正誤の組合せを選べ。\n試料容器は、特に指定がない限り（a）ガラス製を用い、有機溶媒でよく洗浄しておく。採取時に試料水で容器を（b）洗浄する。試料は容器内に（c）空間が残らないよう満たして密栓する。","options":["（a）正／（b）正／（c）正","（a）正／（b）誤／（c）誤","（a）誤／（b）正／（c）誤","（a）誤／（b）誤／（c）正","（a）誤／（b）誤／（c）誤"],"answer":2,"brief":"容器はガラス製を用いる。試料水による共洗いは容器壁への吸着を招くので行わない。容器に少し空間を残し、開栓時に浮遊物質の付着物がこぼれるのを避ける。","confidence":"checked"},{"n":85,"page":188,"prompt":"「JIS K 0312」のダイオキシン類の同定及び定量について、下線部（a）～（c）の正誤の組合せを選べ。\nキャピラリーカラムを用いるガスクロマトグラフと（a）四重極形質量分析計を用い、分解能（b）1,000での測定を維持する。保持時間とイオン強度比を確認後、ピーク面積から（c）内標準法によって定量する。","options":["（a）誤／（b）正／（c）正","（a）正／（b）正／（c）誤","（a）正／（b）誤／（c）正","（a）誤／（b）誤／（c）正","（a）正／（b）誤／（c）誤"],"answer":4,"brief":"質量分析計は二重収束形等の高分解能機を用い、分解能10,000程度を確保する。定量には内標準法を使用する。したがって（a）誤・（b）誤・（c）正。","confidence":"checked"},{"n":86,"page":189,"prompt":"「JIS K 0312」に基づくダイオキシン類の定量で、測定法・要求分解能・検出法の組合せとして正しいものを一つ選べ。","options":["HPLC/MS／1,000／全イオン検出","HPLC/MS／1,000／選択イオン検出","GC/MS／1,000／選択イオン検出","GC/MS／10,000以上／全イオン検出","GC/MS／10,000以上／選択イオン検出"],"answer":5,"brief":"ダイオキシン類は高分解能GC/MSを用い、分解能10,000以上を確保し、選択イオン検出法で定量する。","confidence":"checked"},{"n":87,"page":189,"prompt":"水質試料の保存操作について誤っているものはどれか。","options":["測定項目ごとに保存容器やpH条件が異なる。","揮発性成分は気泡や揮散を防ぐ必要がある。","試料採取後は可能な限り速やかに分析する。","必要に応じて冷暗所で保存する。","すべての項目を強酸性にすれば化学形を変えずに保存できる。"],"answer":5,"brief":"保存条件は目的成分ごとに異なる。シアン化物、六価クロム、VOCなどでは特に化学形・揮散・吸着に注意。","confidence":"rewritten"},{"n":88,"page":190,"prompt":"工場排水の水質指標について誤っているものはどれか。","options":["BODは好気性微生物による酸素消費を利用する。","CODは指定した酸化剤による酸素消費量を求める。","pHはガラス電極法などで測定する。","BODは酸化剤による化学的な酸素消費量だけを表す。","SSはろ過で捕集した懸濁物質の質量から求める。"],"answer":4,"brief":"BODは生物化学的酸素要求量、CODは化学的酸素要求量で、測定原理が異なる。","confidence":"rewritten"},{"n":89,"page":191,"prompt":"工場排水中のふっ化物イオンを定量する方法として適切なのはどれか。","options":["水素炎イオン化検出器（FID）単独","ジルコニア式酸素計","ベータ線吸収法","磁気風式酸素計","イオン電極法"],"answer":5,"brief":"フッ化物イオンは適切なpH・イオン強度条件でイオン選択性電極やIC等で定量できる。","confidence":"rewritten"},{"n":90,"page":191,"prompt":"イオンクロマトグラフ法による塩化物イオンの定量で不適切なものはどれか。","options":["陰イオン交換カラムで目的イオンを分離できる。","分離カラムを使わず試料の全導電率を塩化物濃度とみなす。","サプレッサーで背景導電率を下げる方法がある。","塩化物イオン標準液で検量線を作成する。","試料中の共存イオンによる分離への影響を考慮する。"],"answer":2,"brief":"ICは各イオンを保持時間で分離して定量する。全導電率だけでは塩化物イオンを選択的に定量できない。","confidence":"rewritten"},{"n":91,"page":192,"prompt":"水中の残留塩素について、正しい説明はどれか。","options":["遊離残留塩素と結合残留塩素を含む。","水中の塩化物イオンCl⁻の総量だけを表す。","全窒素と同じ指標である。","遊離残留塩素は硫酸イオンから生じる。","残留塩素は酸素飽和度の別名である。"],"answer":1,"brief":"残留塩素は消毒力に関連し、次亜塩素酸やクロラミン類などを含む。塩化物イオンとは区別する。","confidence":"rewritten"},{"n":92,"page":193,"prompt":"シアン化物を含む水質試料の保存で誤っている方法はどれか。","options":["アルカリ性にしてHCNの揮散を抑える。","試料の採取から分析までの時間を管理する。","必要に応じて低温・遮光で保存する。","目的成分の化学形を保つ条件を確認する。","塩酸を加えて強酸性にして開放容器で保存する。"],"answer":5,"brief":"CN⁻を酸性にすると有毒なHCNが発生し揮散し得るため、不適切。","confidence":"rewritten"},{"n":93,"page":193,"prompt":"「JIS K 0102 工場排水試験方法」の懸濁物質及び蒸発残留物の定義について、誤っているものを一つ選べ。","options":["懸濁物質とは、ろ過材上に残留する物質である。","全蒸発残留物とは、試料を蒸発乾固して残る物質である。","溶解性蒸発残留物とは、試料を蒸発乾固してから塩酸を加え、ろ過材上に残る物質である。","強熱残留物は、試料由来の残留物を約600℃で30分間強熱した後に残る物質である。","強熱減量は、強熱前後で減少した質量である。"],"answer":3,"brief":"溶解性蒸発残留物は、試料を先にろ過して、そのろ液を蒸発乾固して得る。蒸発乾固後に塩酸を加え、ろ過材上の残留物を測る定義ではない。","confidence":"checked"},{"n":94,"page":194,"prompt":"「JIS K 0102 工場排水試験方法」の分析法で、ICP発光分光分析法が適用されていないものを一つ選べ。","options":["ほう素","全りん","ナトリウム","鉄","すず"],"answer":2,"brief":"教材に掲げられた当時のJIS K 0102では、全りんはりん酸イオンにしてモリブデン青吸光光度法、IC法、流れ分析法等で定量する。その他の4成分にはICP発光分光法が適用される。","confidence":"checked"},{"n":95,"page":194,"prompt":"ICで複数の陰イオンを分離するときに適切なものはどれか。","options":["検出前にすべての陰イオンを同じ物質へ変える。","サプレッサーの目的はGCの気化室を加熱することである。","採取後に必ず酸分解して測定する。","保持時間で各成分を識別し、標準液のピーク面積などで定量する。","すべての陰イオンは保持時間が等しい。"],"answer":4,"brief":"ICは分離カラムと検出器を組み合わせ、目的イオンごとのピークを利用する。","confidence":"rewritten"},{"n":96,"page":195,"prompt":"溶存金属の測定試料の扱いとして適切なのはどれか。","options":["採取後に必要なろ過を行い、測定法に従って保存する。","全金属と溶存金属は常に同じ前処理をする。","ろ過後の固形残渣だけが溶存金属である。","すべての元素の価数を無視してよい。","採取容器からの金属汚染は影響しない。"],"answer":1,"brief":"「溶存」と「全量」は試料のろ過・分解操作が異なる。目的形態を保って保存する。","confidence":"rewritten"},{"n":97,"page":196,"prompt":"塩化物イオン選択性電極法に関する説明として誤っているものはどれか。","options":["電極電位はネルンスト式に従う応答を示す。","比較電極と組み合わせて電位差を測る。","イオン強度調整が必要になる場合がある。","共存イオンによる妨害を考慮する。","電極電位は塩化物イオンの活量と一次比例する。"],"answer":5,"brief":"電位は原則としてイオン活量の常用対数に比例する。活量そのものと直線比例するとは限らない。","confidence":"rewritten"},{"n":98,"page":196,"prompt":"イオンクロマトグラフ法で正しい説明はどれか。","options":["各イオンの分離にカラムは不要である。","サプレッサーは必ず検出器の後方に置かれる。","溶離液の条件とカラムによって各イオンの保持時間が異なる。","試料中の全イオンは同じピークとして現れる。","検量線に標準液は使用できない。"],"answer":3,"brief":"陰イオン交換などの相互作用により溶出時間が変わり、ピークごとに定量できる。","confidence":"rewritten"},{"n":99,"page":197,"prompt":"「JIS K 0102 工場排水試験方法」の試料の保存処理について、誤っているものを一つ選べ。","options":["アンモニウムイオン、有機体窒素、全窒素の試料は、塩酸又は硫酸でpH2～3とし、0～10℃の暗所に保存する。","亜硝酸イオン及び硝酸イオンの試料は、クロロホルムを加えて0～10℃の暗所に保存する。","よう化物イオン及び臭化物イオンの試料は、NaOH水溶液でpH約10として保存する。","銅、亜鉛、鉛、カドミウム、マンガン、鉄など金属元素の試料は、硝酸でpH約1として保存する。","シアン化合物及び硫化物イオンの試料は、塩酸でpH約1として保存する。"],"answer":5,"brief":"シアン化物を酸性にするとHCNとなって揮散し、硫化物も酸性でH₂Sとして失われるおそれがある。保存にはNaOHでpH約12のアルカリ性とする。","confidence":"checked"},{"n":100,"page":198,"prompt":"「JIS K 0102 工場排水試験方法」における水素化物発生ICP発光分光分析法によるひ素の定量操作について、下線部（ア）～（エ）の正誤の組合せを選べ。\n試料に硫酸及び（ア）硝酸を加え、さらに（イ）過マンガン酸カリウム溶液を加える。加熱後に冷却して水、塩酸、（ウ）よう化カリウム溶液及びアスコルビン酸溶液を加える。連続式水素化物発生装置に（エ）テトラヒドロほう酸ナトリウム溶液と塩酸を導入し、発生した水素化ひ素を測定する。","options":["（ア）正／（イ）正／（ウ）正／（エ）正","（ア）誤／（イ）正／（ウ）正／（エ）正","（ア）正／（イ）誤／（ウ）正／（エ）正","（ア）正／（イ）正／（ウ）誤／（エ）正","（ア）正／（イ）正／（ウ）正／（エ）誤"],"answer":1,"brief":"硫酸・硝酸と過マンガン酸カリウムでひ素を酸化し、よう化カリウム等で水素化物形成に適した価数に還元する。テトラヒドロほう酸ナトリウムでAsH₃を発生させ、ICP発光強度を測る。各記述は正しい。","confidence":"checked"},{"n":101,"page":198,"prompt":"金属元素のキレート樹脂による分離・濃縮について誤っているものはどれか。","options":["カドミウムなどの重金属を捕集できる樹脂がある。","pH条件が捕集率に影響する。","捕集後に酸で溶出して測定できる。","アルカリ金属のナトリウムやカリウムを重金属と同様に必ず高効率で濃縮できる。","空試験による汚染確認が重要である。"],"answer":4,"brief":"キレート樹脂は金属錯形成の性質を利用する。Na⁺やK⁺は一般に重金属と捕集挙動が異なる。","confidence":"rewritten"},{"n":102,"page":199,"prompt":"「JIS K 0102 工場排水試験方法」のよう素滴定法による溶存酸素の定量で、下線部（a）～（d）の正誤の組合せを選べ。\n試料に硫酸マンガン(Ⅱ)溶液とアルカリ性（a）よう化カリウム－アジ化ナトリウム溶液を加える。生じた（b）水酸化マンガン(Ⅲ)の白色沈殿が、溶存酸素によって（c）水酸化マンガン(Ⅱ)の褐色沈殿となる。続いて（d）硫酸を加え、遊離したよう素を滴定する。","options":["（a）正／（b）誤／（c）誤／（d）正","（a）正／（b）正／（c）正／（d）正","（a）誤／（b）正／（c）正／（d）誤","（a）誤／（b）誤／（c）誤／（d）正","（a）正／（b）誤／（c）誤／（d）誤"],"answer":1,"brief":"ウィンクラー法では、初めに白色のMn(OH)₂が生じ、溶存酸素により褐色のMn(OH)₃となる。下線部（b）と（c）の価数が逆なので誤り。（a）（d）は正しい。","confidence":"checked"},{"n":103,"page":200,"prompt":"ICP発光分光分析法について誤っているものはどれか。","options":["複数元素を同時に測定できる。","内標準元素による補正を利用することがある。","カルシウムやマグネシウムの測定にも利用できる。","分析波長の選定が重要である。","試料中の金属錯体を有機溶媒に抽出し、そのまま全条件で無調整導入してよい。"],"answer":5,"brief":"ICPへの有機溶媒導入はプラズマ安定性や装置適合性などを考慮する必要がある。","confidence":"rewritten"},{"n":104,"page":200,"prompt":"「JIS K 0102 工場排水試験方法」の六価クロムの定量について、誤っているものを一つ選べ。","options":["ジフェニルカルバジド吸光光度法では、1,5-ジフェニルカルボノヒドラジドを加えて発色錯体を生成する。","還元性物質を含む場合、強酸性の試料にアスコルビン酸を加えることでクロムの原子価変化を避けられる。","ジフェニルカルバジド吸光光度法では、水銀塩の共存による発色がCr(VI)より著しく低い。","ジフェニルカルバジド吸光光度法で、バナジウムは発色するが、時間の経過で退色する。","吸光光度法のほか、ICP発光分光分析法等による定量法も規定されている。"],"answer":2,"brief":"アスコルビン酸は還元剤なので、Cr(VI)の価数を変えてしまう。還元性物質の影響に対しては適切な酸化処理を行い、目的成分の価数変化を防ぐ。","confidence":"checked"},{"n":105,"page":201,"prompt":"「JIS K 0102 工場排水試験方法」で、ICP発光分光分析法が適用されていない金属元素を一つ選べ。","options":["アルミニウム","カリウム","マンガン","鉄","すず"],"answer":2,"brief":"教材に示された適用範囲では、カリウムなどアルカリ金属はICP発光分光法の対象とされない。イオン化干渉が大きいためである。","confidence":"checked"},{"n":106,"page":202,"prompt":"「JIS K 0102 工場排水試験方法」の水素化物発生ICP発光分光分析法によるひ素の定量に関する一連の操作のうち、下線部（ア）～（エ）の正誤の組合せとして正しいものを選べ。\n試料に硫酸及び（ア）硝酸を加え、さらに（イ）よう化カリウム溶液を着色するまで滴下する。加熱し硫酸白煙を発生させて冷却後、水、塩酸、（ウ）過マンガン酸カリウム溶液及びアスコルビン酸溶液を加える。連続式水素化物発生装置で、試料溶液と（エ）テトラヒドロほう酸ナトリウム溶液及び塩酸を反応させ、水素化ひ素を発生させる。","options":["（ア）正／（イ）誤／（ウ）誤／（エ）正","（ア）正／（イ）正／（ウ）正／（エ）誤","（ア）誤／（イ）正／（ウ）正／（エ）誤","（ア）誤／（イ）誤／（ウ）誤／（エ）正","（ア）正／（イ）正／（ウ）誤／（エ）正"],"answer":1,"brief":"前処理で加えるのは過マンガン酸カリウム溶液、予備還元処理で加えるのがよう化カリウム溶液。原文の（イ）（ウ）は逆。硝酸とテトラヒドロほう酸ナトリウムは正しい。","confidence":"checked"},{"n":107,"page":202,"prompt":"「JIS K 0102 工場排水試験方法」の原子吸光法（ア）フレーム、（イ）水素化物発生、（ウ）還元気化に対応する分析対象成分の組合せとして正しいものを一つ選べ。","options":["全りん／硫化物イオン／全水銀","ナトリウム／鉛／カドミウム","鉛／アンチモン／全水銀","全りん／アンチモン／カドミウム","ナトリウム／硫化物イオン／鉛"],"answer":3,"brief":"フレーム原子吸光法はPb、水素化物発生法はSbをSbH₃として気化して測定し、還元気化法はHgを原子状水銀として測定する。","confidence":"checked"},{"n":108,"page":203,"prompt":"「JIS K 0102 工場排水試験方法」による全りんのペルオキソ二硫酸カリウム分解法について、（ア）～（エ）の正誤の組合せを選べ。\n試料をペルオキソ二硫酸カリウムで（ア）40℃で60分間加温して分解する。生成したりん酸イオンをモリブデン酸アンモニウム等と反応させた後、（イ）L(+)-アスコルビン酸で（ウ）酸化し、生成したモリブデン青の吸光度を（エ）880 nm付近で測定する。","options":["（ア）正／（イ）正／（ウ）誤／（エ）誤","（ア）正／（イ）誤／（ウ）正／（エ）誤","（ア）正／（イ）誤／（ウ）誤／（エ）正","（ア）誤／（イ）正／（ウ）誤／（エ）正","（ア）誤／（イ）正／（ウ）正／（エ）誤"],"answer":4,"brief":"分解条件は約120℃に達してから30分間である。L(+)-アスコルビン酸は還元剤で、モリブデン青を生成させる。測定波長880 nmは正しい。","confidence":"checked"},{"n":109,"page":203,"prompt":"「JIS K 0102 工場排水試験方法」で、フレーム原子吸光分析の前処理としてキレート樹脂による分離濃縮法を適用できない元素を一つ選べ。","options":["カリウム","鉛","銅","亜鉛","カドミウム"],"answer":1,"brief":"カリウムなどのアルカリ金属はキレートをほとんど形成せず、キレート樹脂による分離濃縮が適用されない。","confidence":"checked"},{"n":110,"page":204,"prompt":"吸光光度法の定量について適切なのはどれか。","options":["吸光度が大きいほど必ず定量精度が上がる。","検量線の範囲内で、できれば中央付近の吸光度になるよう濃度を調整する。","ガラスセルは石英セルよりすべての紫外波長で透過性が高い。","測定セルの光路長は結果に関係しない。","校正液は一つの濃度だけで十分である。"],"answer":2,"brief":"検量線の範囲内で測ることが原則。濃度が高すぎる場合は適切に希釈する。","confidence":"rewritten"},{"n":111,"page":205,"prompt":"吸光度Aの定義として正しいものはどれか。","options":["A＝log₁₀(I₀/I)","A＝I/I₀","A＝I₀/I","A＝I×I₀","A＝−log₁₀(I₀/I)"],"answer":1,"brief":"吸光度は透過率T＝I/I₀の負の常用対数、A＝−log₁₀T。透過率と混同しない。","confidence":"rewritten"},{"n":112,"page":205,"prompt":"吸光光度法の標準添加法について誤っているものはどれか。","options":["マトリックス効果を補正するために使うことがある。","試料一定量に目的成分を段階的に添加する。","検量線が曲がっていても、標準添加法で必ず正確に直線外挿できる。","測定信号を添加濃度に対してプロットする。","線形性が成立する範囲を確認する。"],"answer":3,"brief":"標準添加法でも測定信号と濃度の適切な関係が必要。非線形を無条件で解決できるわけではない。","confi 器、⑤水素化物発生装置","options":["一つ","二つ","三つ","四つ","五つ"],"answer":4,"brief":"①ネブライザー、③半導体検出器、④分光器、⑤水素化物発生装置の4つが両装置で使われ得る。②ゼーマン分裂補正方式は原子吸光の背景補正方式で、ICP発光分光分析には用いない。","confidence":"checked"},{"n":121,"page":214,"prompt":"電気加熱原子吸光分析でミストや微粒子により見かけの吸光度が増加した。適切な対策はどれか。","options":["試料を無条件に濃縮する。","GCのスプリット比を上げる。","イオン電極を用いて測定する。","ゼーマン法などのバックグラウンド補正を行う。","ダブルビーム方式だけで必ず完全に補正できる。"],"answer":4,"brief":"粒子散乱などの背景信号は、原子吸光の背景補正機構で補正できる場合がある。","confidence":"rewritten"},{"n":122,"page":215,"prompt":"原子吸光装置で使用する高圧ガス容器の安全管理として、誤っているものはどれか。","options":["容器の転倒防止措置を行う。","直射日光や熱源への曝露を避ける。","漏れの有無を適切に点検する。","高圧ガス容器は屋外設置が法令上すべて禁止されている。","アセチレンに適した配管材を選ぶ。"],"answer":4,"brief":"容器は法令や安全基準を満たす適切な場所に設置する。屋外を一律に禁止するものではない。","confidence":"rewritten"},{"n":123,"page":215,"prompt":"「JIS K 0114 ガスクロマトグラフィー通則」に規定されている検出器に関する次の記述の中から、正しいものを一つ選べ。","options":["熱伝導度検出器は、測定対象化合物の熱伝導度がキャリヤーガスのそれに近いほど高感度に検出する。","水素炎イオン化検出器は有機化合物のほとんどを対象とするが、検量線の直線領域は2桁前後の狭い範囲に限られる。","電子捕獲検出器は電子親和性の高い化合物を選択的に検出し、検量線の直線領域は7桁前後の非常に広い範囲に及ぶ。","炎光光度検出器は硫黄、りん及びすずを含有する化合物を対象とするが、硫黄の検量線は近似二次曲線となる。","熱イオン化検出器はりん又は塩素を含む化合物を選択的に検出し、一般にりんよりも塩素の方が感度は高い。"],"answer":4,"brief":"炎光光度検出器（FPD）は硫黄・りんなどに選択性を示し、硫黄の応答は概ね二次関数的になる。","confidence":"checked"},{"n":124,"page":216,"prompt":"ガスクロマトグラフィーにおける試料の誘導体化に関する次の記述の中から、誤っているものを一つ選べ。","options":["誘導体化することで、揮発性や安定性を向上させ、分離を容易にすることができる。","分析種を検出しやすい化学形にすることで、選択性を向上させ、高感度検出を可能とすることができる。","オンカラム誘導体化とは、誘導体化試薬と試料を混合した溶液を冷却した注入口に注入して反応させる方法である。","光学異性体を、キラル試薬を用いてジアステレオマー化することで、光学活性カラムを使わずに分離可能にできる。","誘導体化試薬は反応性の高い試薬が多いため、湿気を避け密栓し冷暗所に保管する。"],"answer":3,"brief":"オンカラム誘導体化は、試料溶液へ誘導体化試薬をあらかじめ加えて加熱した注入口に導入する等の方法。冷却注入口に注入して反応させるとの説明が不適切。","confidence":"checked"},{"n":125,"page":217,"prompt":"GC装置の使用上の注意として誤っているものはどれか。","options":["試料の組成によらず、気化注入後のカラムへ必ず完全に同じ組成で導入される。","多量注入はカラム過負荷の原因になる。","注入口の汚れはゴーストピークの原因になり得る。","装置・標準液の汚染に注意する。","試料の気化・分解・吸着の影響を確認する。"],"answer":1,"brief":"GC注入口では試料の成分ごとに気化のしやすさが異なり、注入時の分別が起こることがある。","confidence":"rewritten"},{"n":126,"page":218,"prompt":"GCのコールドオンカラム注入法について、誤っているものはどれか。","options":["試料を低温状態のカラム入口へ直接導入する。","熱に弱い成分への分解抑制に有効な場合がある。","注入後に温度を上昇させて分離する方法がある。","試料を必ず高温の注入口で瞬間気化させてからカラムに導入する。","スプリット注入法と導入方式が異なる。"],"answer":4,"brief":"オンカラム注入法は試料をカラムへ直接導入するため、加熱気化室での瞬間気化を必須としない。","confidence":"rewritten"},{"n":127,"page":219,"prompt":"ガスクロマトグラフ検出器と測定に使用する気体の組合せとして、誤っているものはどれか。","options":["ECD ― 塩素ガスをキャリヤーとして使用する。","FID ― 水素と空気を使用する。","FPD ― 水素と空気を使用する。","TCD ― ヘリウムをキャリヤーとして用いる場合がある。","ECD ― 窒素などの適切なキャリヤーガスを使用する。"],"answer":1,"brief":"ECDには窒素などを用いる。塩素ガスをキャリヤーとして用いるのは不適切。","confidence":"rewritten"},{"n":128,"page":219,"prompt":"GCの理論段数Nと理論段相当高さHについて誤っているものはどれか。","options":["N＝L/Hの関係がある。","Hが小さいほど一般に段効率が高い。","キャリヤーガスの線速度はHに影響する。","カラム長が同じなら、Hが大きいほど分離効率が高い。","カラム径や液膜厚は段効率に影響し得る。"],"answer":4,"brief":"カラム長一定ならHが小さいほどNが大きい。","confidence":"rewritten"},{"n":129,"page":220,"prompt":"GC検出器について誤っているものはどれか。","options":["FIDは炎中のイオン電流を検出する。","TCDは熱伝導率差を利用する。","FPDは炎中の発光を測る。","光イオン化検出器（PID）は電子捕獲反応のみを測定原理とする。","ECDは電子捕獲現象を利用する。"],"answer":4,"brief":"PIDは紫外光などによる光イオン化を利用し、電子捕獲検出器ECDとは異なる。","confidence":"rewritten"},{"n":130,"page":221,"prompt":"質量分析における電子イオン化（EI）法の説明として誤っているものはどれか。","options":["大気圧下で電子を照射するのがEI法の一般的な動作条件である。","高真空下で分子に電子を衝突させる。","フラグメントイオンが生成しやすい。","GC/MSのイオン化に使われる。","電子衝突により分子が陽イオンになる。"],"answer":1,"brief":"EI法は一般に真空中で行われる電子衝突によるイオン化法。","confidence":"rewritten"},{"n":131,"page":222,"prompt":"タンデム質量分析の選択反応モニタリング（SRM）について、正しいものはどれか。","options":["試料中のすべての質量範囲を無選択で連続走査するだけである。","ガスの熱伝導率差のみを測る。","pH電極の電位から質量を測る。","選択した前駆体イオンを解離させ、特定の生成物イオンを検出する。","ベータ線吸収量を分子量へ換算する。"],"answer":4,"brief":"SRM/MRMは前駆体イオンと生成物イオンの組合せを選ぶため高い選択性が得られる。","confidence":"rewritten"},{"n":132,"page":223,"prompt":"質量分析に関して誤っているものはどれか。","options":["質量分析で測定できるのは正イオンだけであり負イオンは測定できない。","測定対象は質量電荷比m/zである。","ESIでは溶液からイオンを生成できる。","TOF-MSではイオンの飛行時間差を利用する。","フラグメンテーションで結合開裂由来のイオンが生じる。"],"answer":1,"brief":"質量分析には正イオンモードと負イオンモードがある。","confidence":"rewritten"},{"n":133,"page":224,"prompt":"GC/MSの基本構成と測定する物理量の組合せとして正しいものはどれか。","options":["イオン源 ― pHガラス電極 ― 水素イオン活量のみ","フレーム ― ベータ線検出器 ― 粒子質量のみ","イオン源 ― 熱伝導度検出器 ― ガスの温度のみ","サプレッサー ― 導電率計 ― 酸素分圧のみ","イオン源 ― 質量分離部 ― m/z（質量電荷比）"],"answer":5,"brief":"GC分離後にイオン化し、質量分析部でm/zに応じてイオンを選別・検出する。","confidence":"rewritten"},{"n":134,"page":225,"prompt":"GC/MSの電子イオン化（EI）法におけるイオン源の構成要素と成り得ないものを一つ選べ。","options":["フィラメント","引き出し電極","誘導コイル","押し出し電極","電子トラップ"],"answer":3,"brief":"EI法は加熱したフィラメントから電子を放出し、試料分子に衝突させる。引き出し電極、押し出し電極、電子トラップなどを使うが、誘導コイルはEIイオン源の構成要素ではない。","confidence":"checked"},{"n":135,"page":225,"prompt":"GC/MSの説明で誤っているものはどれか。","options":["質量軸を標準物質で校正する。","SIM法で指定したm/zを監視できる。","鏡像異性体の絶対配置は一般にEI質量スペクトルだけで一意に決定できる。","内標準法は定量に用いられる。","CI法では反応ガスを使用することがある。"],"answer":3,"brief":"鏡像異性体は通常同じ質量スペクトルを示す。立体化学の識別にはキラル分離などが必要。","confidence":"rewritten"},{"n":136,"page":226,"prompt":"ICP発光分光分析で、共存元素によるスペクトル線の重なりを軽減する対策として不適切なものはどれか。","options":["重なりの少ない分析線を選ぶ。","バックグラウンド補正を行う。","共存元素の寄与を測定して数値補正する。","可能なら分離前処理で妨害成分を低減する。","標準添加法を用いればスペクトル線の重なりを必ず除去できる。"],"answer":5,"brief":"標準添加法は主にマトリックス効果に対処する。ピークの重なりの補正は分析線選択や分光補正が基本。","confidence":"rewritten"},{"n":137,"page":226,"prompt":"「JIS K 0116 発光分光分析通則」において、ICP発光分光分析による定量法や補正法として記載されていないものを一つ選べ。","options":["内標準法","標準添加法","同位体希釈分析法","分光干渉補正","バックグラウンド補正"],"answer":3,"brief":"同位体希釈分析法は主としてICP-MSなどで用いられる。ICP-OESにおける発光の干渉補正・内標準法・標準添加法と混同しない。","confidence":"checked"},{"n":138,"page":227,"prompt":"ICP発光分光分析法における干渉とその原因の組合せとして、誤っているものを一つ選べ。","options":["物理干渉 ― 標準液と試料溶液との粘度の違い","分光干渉 ― 測定対象元素の波長に近接する分子バンドスペクトル","物理干渉 ― プラズマ内の電子密度の増加","イオン化干渉 ― 共存する高濃度のアルカリ金属","分光干渉 ― 高濃度で含まれる元素の発光によって増加するバックグラウンド"],"answer":3,"brief":"プラズマ内の電子密度増加はイオン化平衡に関係し、「物理干渉」の原因として分類するのは不適切。","confidence":"checked"},{"n":139,"page":228,"prompt":"「JIS K 0133 高周波プラズマ質量分析通則」のICP-MSコリジョン・リアクションセルについて、下線部（a）～（c）の正誤の組合せを一つ選べ。\nコリジョン・リアクションセルは、目的元素以外のイオンによる（a）非スペクトル干渉を除去又は低減するための装置であり、（b）質量分離部の後ろに設ける。気体分子（He、H₂、NH₃など）を導入してイオンと相互作用させ、（c）イオンの運動エネルギーの収束も生じる。","options":["（a）正／（b）正／（c）正","（a）正／（b）誤／（c）誤","（a）誤／（b）正／（c）誤","（a）誤／（b）誤／（c）正","（a）誤／（b）誤／（c）誤"],"answer":4,"brief":"セルは質量分離部の前に配置し、測定対象イオンと妨害イオンの衝突・反応特性の差を利用してスペクトル干渉を低減する。衝突によってイオンの運動エネルギーが収束する効果もある。","confidence":"checked"},{"n":140,"page":229,"prompt":"ICP質量分析（ICP-MS）の装置構成について誤っているものはどれか。","options":["ネブライザーで試料溶液を霧化する。","スプレーチャンバーで大きい液滴を除く。","サンプリング・スキマーコーンで大気圧プラズマからイオンを導入する。","一般的な四重極分析器は同じm/zの干渉イオンと目的イオンを完全に識別できる。","イオンレンズでイオンを質量分離部へ導く。"],"answer":4,"brief":"四重極はm/zで分離する。目的元素と同じm/zの多原子イオンには衝突・反応セルなどの対策が必要。","confidence":"rewritten"},{"n":141,"page":230,"prompt":"ICP-MSのインターフェース部に設けられる部品の組合せとして正しいものはどれか。","options":["水素炎と石英セル","サンプリングコーンとスキマーコーン","pH電極と比較電極","液体クロマトカラムとサプレッサー","ベータ線源とろ紙"],"answer":2,"brief":"大気圧のプラズマから真空系へイオンを取り込むために二つのコーンを用いる。","confidence":"rewritten"},{"n":142,"page":230,"prompt":"次に示した定量法のうち、ICP 質量分析法で使用されないものを一つ選べ。","options":["検量線法","内標準法","ファンダメンタルパラメーター（FP）法","同位体希釈分析法","標準添加法"],"answer":3,"brief":"FP法は主として蛍光X線分析の理論強度計算法に対応する。ICP-MSの定量法には検量線法・内標準法・標準添加法・同位体希釈分析法がある。","confidence":"checked"},{"n":143,"page":232,"prompt":"高速液体クロマトグラフィー（HPLC）の分離度について誤っているものはどれか。","options":["二つのピークの高さの比だけで分離度が定義される。","保持時間の差が分離度に関係する。","ピーク幅も分離度に関係する。","保持時間が近い成分は分離しにくい場合がある。","カラムや移動相の条件変更で分離度が変わり得る。"],"answer":1,"brief":"分離度は保持時間差とピーク幅から求める指標であり、ピーク高さの比ではない。","confidence":"rewritten"},{"n":144,"page":233,"prompt":"HPLC分析について誤っているものはどれか。","options":["移動相を脱気することがある。","試料ループを使う導入方式がある。","プレカラム誘導体化を用いることがある。","測定中は移動相の溶媒組成を絶対に変化させてはならない。","移動相組成を変えるグラジエント溶離がある。"],"answer":4,"brief":"グラジエント溶離では、測定中に移動相組成を連続的または段階的に変化させる。","confidence":"rewritten"},{"n":145,"page":233,"prompt":"HPLCを用いる公定分析法における、分析対象化合物と検出器の組合せとして誤っているものを一つ選べ。","options":["オキシン銅（JIS K 0128）― 吸光光度検出器","ベンゾ[a]ピレン（有害大気汚染物質測定マニュアル）― 蛍光検出器","ノニルフェノール類（昭和46年環告59）― 電気伝導度検出器","直鎖アルキルベンゼンスルホン酸（昭和46年環告59）― 質量分析計","エトフェンプロックス（JIS K 0128）― 吸光光度検出器"],"answer":3,"brief":"ノニルフェノール類の公定分析にはGC/MSを使用するため、電気伝導度検出器との組合せが誤りである。","confidence":"checked"},{"n":146,"page":234,"prompt":"「JIS K 0127 イオンクロマトグラフィー通則」に規定されているサプレッサーについて、（ア）～（ウ）に入る語句の組合せとして正しいものを一つ選べ。\nサプレッサーは（ア）交換部位（膜又は樹脂）を介した（ア）交換によって（イ）の電気伝導度を低下し、測定イオンの対イオンを、より電気伝導度の（ウ）イオンに交換することでS/N比を改善し、測定感度を高める。","options":["イオン／固定相／低い","イオン／ ["カドミウム／0.003 mg/L 以下","全シアン／検出されないこと","鉛／0.01 mg/L 以下","ひ素／0.001 mg/L 以下","総水銀／0.0005 mg/L 以下"],"answer":4,"brief":"教材掲載時の基準値は、ひ素0.01 mg/L以下。0.001 mg/Lという組合せが誤り。基準値の現行版とは区別する。。※六価クロムの基準などはその後改正があるため、現行値は環境省の公表資料を確認する。","confidence":"checked"},{"n":167,"page":249,"prompt":"環境試料の採取法に関する次の記述の中から、誤っているものを一つ選べ","options":["ハイボリウムエアサンプラは、大気中に浮遊する粒子状物質の捕集装置の一つである。","キャニスターは、空気中の揮発性有機化合物などを測定するための採取器の一つである。","ハイロート採水器は、降水試料の採取器の一つである。","エクマンバージ採泥器は、水底の表層堆積物の採取器の一つである。","サーバーネットは、浅い河川の底などに生息する生物の採取器の一つである。"],"answer":3,"brief":"ハイロート採水器は河川・湖沼・海水などの採水に使われる。降水試料の採取器ではない。","confidence":"checked"},{"n":168,"page":249,"prompt":"水質汚濁に係る環境基準「人の健康の保護に関する環境基準」のうち、書籍の出題当時の基準値との組合せで、誤っているものを一つ選べ。※六価クロムの基準値はその後改正された。","options":["カドミウム／0.003 mg/L 以下","ひ素／0.01 mg/L 以下","セレン／0.01 mg/L 以下","六価クロム／0.05 mg/L 以下","総水銀／0.01 mg/L 以下"],"answer":5,"brief":"書籍出題当時の総水銀の基準は0.0005 mg/Lで、0.01 mg/Lではない。なお六価クロムの水質環境基準は2021年の見直しで0.05から0.02 mg/Lへ変更されている。","confidence":"checked"},{"n":169,"page":250,"prompt":"ガス分析装置へ校正用ガスを導入する配管について誤っているものはどれか。","options":["校正用ガスの導入配管は可能な限り短くする。","圧力調整器の材質にも注意する。","目的成分に対して吸着性・反応性・透過性が大きい材料を優先して用いる。","装置を振動や温度変動の少ない場所に設置する。","高圧容器の圧力調整器を適切に使用する。"],"answer":3,"brief":"配管での成分損失や汚染を避けるため、不活性で透過や吸着の少ない材質を選ぶ。","confidence":"rewritten"},{"n":170,"page":251,"prompt":"ガス分析装置の校正でスパンガスを使用する目的として適切なのはどれか。","options":["計器の最小目盛だけを確認する。","測定レンジの最大目盛付近の指示値を確認・調整する。","試料ガスの水分を吸収除去する。","標準液のpHを調整する。","排ガスを完全に無害化する。"],"answer":2,"brief":"ゼロガスは低濃度側、スパンガスは測定レンジ上限付近、中間点ガスはその間を確認する。","confidence":"rewritten"},{"n":171,"page":251,"prompt":"「JIS K 0055 ガス分析装置校正方法通則 」 に規定されている校正用ガスに関する次\nの記述の中から、誤っているものを一つ選べ。","options":["校正用ガスとは、ゼロガス、スパンガス、中間点ガスの総称である。","校正用ガス調製装置は、未知濃度の目的成分ガスから校正用ガスを調製することができる。","ゼロガスは、分析装置の最小目盛値を校正するために用いる。","希釈ガスは、校正用ガスを調製する際に、目的成分ガスをある濃度に希釈するために用いる。","校正用ガスの調製、充てんには、ガラス製容器を使用することができる。"],"answer":2,"brief":"校正用ガスは既知濃度に調製する必要がある。未知濃度の目的成分ガスをそのまま基準にできない。","confidence":"checked"},{"n":172,"page":252,"prompt":"「JIS K 0050 化学分析方法通則 」 に従って器具を洗浄した。 次の操作の中から\n\n誤っているものを一つ選べ。","option const KEY='kanno_exam_clean_173_v1';let history={};try{history=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=String(txt);return e}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){}}
function start(){set=DB.slice();const r=$('range').value;if(r!=='all'){const [a,b]=r.split('-').map(Number);set=set.filter(q=>q.page>=a&&q.page<=b)}const m=$('mode').value;if(m==='wrong')set=set.filter(q=>history[q.n]?.grade==='wrong');if(m==='unseen')set=set.filter(q=>!history[q.n]);if(m==='test'||m==='random')shuffle(set);if(m==='test')set=set.slice(0,25);pos=0;render()}
function render(){const paper=$('paper');paper.replaceChildren();$('position').textContent=set.length?`${pos+1} / ${set.length}`:'0問';const n=Object.keys(history).length,good=Object.values(history).filter(v=>v.grade==='right').length;$('stats').textContent=`回答済 ${n}/${DB.length}問｜正答 ${good}問`;$('progressbar').style.width=(100*n/DB.length)+'%';if(!set.length){paper.append(node('p','empty','該当する問題がありません。出題モードまたは範囲を変更してください。'));return}const q=set[pos],past=history[q.n]||{},sel=past.selected??null;const top=node('div','qhead');top.append(node('strong','',`問題 ${q.n}`),node('span','',`教材 p.${q.page} ｜ ${q.confidence==='checked'?'問題文を写真と照合':'出題論点に基づく再構成'}`));paper.append(top);paper.append(node('h2','','問題文'));paper.append(node('div','stem',q.prompt));paper.append(node('h2','','選択肢（1つ選ぶ）'));
const choices=node('div','choices');q.options.forEach((opt,i)=>{const n=i+1;let cls='option';if(sel!==null){if(n===q.answer)cls+=' correct';else if(n===sel)cls+=' wrong'}let b=node('button',cls);b.type='button';b.append(node('span','number',n),node('span','body',opt));b.onclick=()=>{history[q.n]={selected:n,grade:n===q.answer?'right':'wrong'};save();render();$('explanation').scrollIntoView({block:'nearest',behavior:'smooth'})};choices.append(b)});paper.append(choices);
const act=node('div','actions');const reveal=node('button','','答えと解説を見る');reveal.onclick=()=>{$('explanation').classList.remove('hidden');$('explanation').scrollIntoView({block:'nearest',behavior:'smooth'})};act.append(reveal);paper.append(act);
const explanation=node('section','explanation'+(sel===null?' hidden':''));explanation.id='explanation';const ans=node('div','answer',`正解：${q.answer}`);if(sel!==null)ans.append(node('span',sel===q.answer?'good':'bad',sel===q.answer?'　正解':'　不正解'));explanation.append(ans,node('div','reason',q.brief));paper.append(explanation);
const nav=node('div','nav');const prev=node('button','','前の問題');prev.disabled=pos===0;prev.onclick=()=>{pos--;render();window.scrollTo(0,0)};const next=node('button','primary',pos+1<set.length?'次の問題 →':'最初へ戻る');next.onclick=()=>{pos=(pos+1)%set.length;render();window.scrollTo(0,0)};nav.append(prev,next);paper.append(nav)}
$('start').onclick=start;$('clear').onclick=()=>{if(confirm('この問題集の回答履歴をすべて消去しますか？')){history={};save();start()}};
document.addEventListener('keydown',ev=>{if(ev.target instanceof HTMLInputElement||ev.target instanceof HTMLSelectElement||ev.target instanceof HTMLTextAreaElement)return;if(/^[1-5]$/.test(ev.key)&&set.length){const q=set[pos];history[q.n]={selected:Number(ev.key),grade:Number(ev.key)===q.answer?'right':'wrong'};save();render();$('explanation').scrollIntoView({block:'nearest',behavior:'smooth'})}if(ev.key==='ArrowRight'&&set.length){pos=(pos+1)%set.length;render();window.scrollTo(0,0)}});
start();
</script></body></html>
